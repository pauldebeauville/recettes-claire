titre: Mi-tarte mi-gâteau aux fraises ou framboises
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 133
portions: Pour 8 personnes
ingredients:
- Sablés épais type Saint-Michel ou Pont Aven
- 2 pots de compote Bonne Maman aux fraises ou framboises
- 1 citron vert
- 250 g de fraises ou framboises
- 30 cl de crème fraîche liquide à 30%
- 1 sachet de sucre vanillé
- 40 g de mascarpone
- groupe: Cercles individuels comprenant
- 37 g de sablés par cercle individuel
- 7,5 g de beurre par cercle individuel
preparation:
- Répartir la compote sur la surface des sablés.
- Couper les fraises en tranches épaisses et les disposer sur le gâteau.
- Zester le citron vert.
- Monter la crème avec le mascarpone et le sucre vanillé pour obtenir une chantilly ferme.
- Ajouter sur le dessus les morceaux de fraises et de zeste de citron vert.
source: Carnet sucré, p. 16
