titre: Fromage Blanc de Reine, Ses Noix Caramélisées et Sa Crème au Caramel
type: sucré
categories:
- dessert
ordre: 145
portions: Pour 6 personnes
ingredients:
- groupe: Fromage blanc
- 500 g de fromage blanc
- 80 g de sucre
- groupe: Noix caramélisées
- 150 g de noix en cerneaux
- 100 g de sucre
- 10 cl d'eau
- groupe: Crème au caramel
- 100 g de sucre
- 1/2 l de lait
- 4 jaunes d’œuf
- 50 g de sucre
preparation:
- section: Préparation des noix caramélisées
- Dans une casserole, faites chauffer le sucre avec 10 cl d’eau pour obtenir un caramel doré.
- Ajoutez les noix et enrobez-les bien avec le caramel.
- Versez les noix caramélisées sur une plaque recouverte de papier sulfurisé et laissez refroidir. Cassez-les en morceaux.
- section: Préparation de la crème au caramel
- Faites chauffer le sucre dans une casserole avec 10cl d'eau jusqu’à obtenir un caramel blond.
- Hors du feu, ajoutez le beurre et mélangez bien.
- Incorporez progressivement le lait tiédi en remuant sans cesse.
- Remettez la casserole sur feu doux.
- Fouettez les jaunes d’œuf et le sucre dans un saladier et incorporer le lait caramélisé tout en fouettant.
- Remettre le tout dans une casserole et faites cuire tout en mélangeant jusqu’à épaississement.
- Débarasser le tout dans un saladier et réservez au réfrégirateur.
- section: Dressage
- Mélangez le fromage blanc avec le sucre en fouettant assez vivement. Réservez au frais
- Versez un cordon de crème caramel dans une assiette.
- Déposez une belle quenelle de fromage blanc au centre.
- Parsemez de morceaux de noix caramélisées.
- Servez frais pour un dessert délicat et gourmand.
source: Carnet sucré, p. 28-29
