titre: Tzatziki
type: salé
categories:
- apéritif
- sauce
vedettes:
- légumes
ordre: 102
ingredients:
- 1 concombre + 1/2, coupé en petits dés
- 150 g de chèvre frais
- 150 g de yaourt grecque
- 3 cuillères à soupe d'huile d'olive
- 3 cuillères à café d'ail surgelé
- Basilic ou menthe
preparation:
- Couper le concombre en petits dés et le mettre dans un grand saladier.
- Ajouter le chèvre frais, le yaourt grec, l'huile d'olive, l'ail surgelé, ainsi que le basilic ou la menthe.
- Mélanger le tout et mettre au frais avant de servir.
source: Carnet salé, p. 112
