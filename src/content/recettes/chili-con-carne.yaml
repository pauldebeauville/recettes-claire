titre: Chili con Carne
type: salé
categories:
- plat
vedettes:
- viande
ordre: 59
versions:
- nom: Version 1
  titre: Chili con Carne
  portions: Pour 6 personnes
  ingredients:
  - 100 g de steak haché par personne (soit 600 g au total)
  - 2 boîtes de haricots rouges (500 g chacune, bocaux en verre et bio)
  - 500 g de tomates pelées en bocal en verre et bio
  - 250 g de maïs en boîte (bocal en verre et bio)
  - 1 à 2 petits bocaux de tomates concassées en bocal en verre et bio
  - 35 cl de bouillon de bœuf
  - 2 oignons
  - 2 gousses d'ail
  preparation:
  - Faire revenir à la poêle la viande hachée. L'ajouter dans une poêle avec oignons et ail hachés.
  - Ajouter la viande hachée, puis les légumes, le concentré de tomates et le bouillon de bœuf.
  - Laisser cuire entre 20 et 30 minutes.
  notes:
  - titre: Astuce
    texte:
    - Vous pouvez ajouter 1 c. à café de chili en poudre ou 2 c. à café de cumin en graines pour plus de saveur.
  source: Carnet salé, p. 65
- nom: Version 2
  titre: Chili con Carne
  portions: Pour 4 personnes
  ingredients:
  - 100 g de poivron rouge en morceaux
  - 100 g de poivron vert en morceaux
  - 100 g d’oignon
  - 2 gousses d’ail
  - 20 g d’huile d’olive
  - 500 g de bœuf haché
  - 1 c.c de cumin en poudre
  - 1 c.c de paprika
  - 400 g de coulis de tomates
  - 500 g de haricots rouges en boîte, égouttés
  - 400 g de maïs en boîte, égouttés
  - Coriandre, sel et poivre
  preparation:
  - Mettre les poivrons, l’oignon et l’ail dans le bol du Thermomix et mixer 5 sec/vitesse 5, en raclant les parois avec la spatule.
  - Ajouter l’huile d’olive, le bœuf haché, le cumin et le paprika. Cuire 5 min/120°/sens inverse/vitesse mijotage.
  - Ajouter le coulis de tomates, saler, poivrer et cuire 8 min/120°/sens inverse/vitesse mijotage.
  - Ajouter les haricots rouges et le maïs. Cuire 5 min/110°/sens inverse/vitesse mijotage.
  - Transvaser dans un plat de service, parsemer de coriandre et servir.
  notes:
  - titre: Astuce
    texte:
    - Vous pouvez ajuster les épices à votre goût.
  source: Carnet salé, p. 66
