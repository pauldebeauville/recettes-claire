titre: Croutons Mozzarella aux Lardons
type: salé
categories:
- apéritif
vedettes:
- fromage
ordre: 101
ingredients:
- Pain (baguette ou petits pains)
- Mozzarella
- Lardons
preparation:
- Couper le pain en tranches ou en petits morceaux.
- Dorer les lardons dans une poêle à feu moyen jusqu'à ce qu'ils soient bien cuits.
- Faire griller les tranches de pain dans une poêle ou au four jusqu'à ce qu'elles soient dorées.
- Ajouter les morceaux de mozzarella sur les croutons de pain et les lardons.
- Faire fondre le tout dans le four ou sous un gril.
source: Carnet salé, p. 111
