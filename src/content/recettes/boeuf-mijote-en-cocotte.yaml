titre: Boeuf mijoté en cocotte
type: salé
categories:
- plat
vedettes:
- viande
ordre: 52
portions: Pour 8/10 personnes
ingredients:
- 3 kg de viande de boeuf pour bourguignon coupée en gros cubes (4 à 5 cm)
- 1 verre de vin blanc sec
- 3 cuillères à soupe de vinaigre balsamique
- 1 cuillère à soupe de sauce soja
- 2 gousses d'ail (avec la peau)
- thym, laurier
- 1 petite boîte de concentré de tomate
- 3 cuillères à soupe de farine
- 1 oignon ciselé
- beurre
preparation:
- Préchauffer le four à 180°C (ou 160°C pour un four à chaleur tournante).
- Dans une cocotte en fonte, faire chauffer 25 g de beurre, et faire dorer la viande (en plusieurs fois) à feu vif. Retirer la viande et ajouter dans le plat les oignons, faites-les dorer rapidement.
- Remettre la viande dans la cocotte et saupoudrer de la farine, remuer pour enrober les morceaux. Ajouter le vin blanc (les 3/4), le vinaigre balsamique, le concentré de tomate, la sauce soja, les gousses d'ail, le thym et le laurier.
- Ajouter 2 à 3 verres d'eau (le 1/4 du liquide total) pour que le liquide recouvre totalement la viande. Saler, poivrer. Surveiller la cuisson dans le four et faites cuire de 2 heures à 2 h 30. Avant de servir, enlever les branches de thym et laurier.
notes:
- titre: Astuce
  texte:
  - Vous pouvez aussi ajouter à la cuisson un morceau d'écorce d'orange, cela parfume de façon très agréable ce plat.
- titre: Accompagnement
  texte:
  - Je le sers accompagné de carottes, panais et pommes de terre cuits à la vapeur, puis simplement écrasés avec un peu d'huile d'olive et de gros sel.
source: Carnet salé, p. 56
