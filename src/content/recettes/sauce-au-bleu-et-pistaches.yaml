titre: Sauce au Bleu et Pistaches
type: salé
categories:
- sauce
vedettes:
- fromage
ordre: 91
temps:
- label: Temps de préparation
  valeur: '5 min + Thermomix : 5 min'
ingredients:
- 20 g de pistaches émondées
- 120 g de Bleu
- 200 g de fromage frais
- 1 c. à soupe de Cognac
preparation:
- Introduire les pistaches dans le bol du Thermomix et hacher 2 secondes à vitesse 5.
- Débarrasser dans un récipient.
- Verser le reste des ingrédients dans le bol et mixer 3 minutes à vitesse 6.
- Ajouter les pistaches et mélanger 10 secondes à vitesse 3.
- Rectifier l'assaisonnement.
notes:
- texte:
  - Cette sauce peut être utilisée pour accompagner des pâtes ou des toasts.
source: Carnet salé, p. 100
