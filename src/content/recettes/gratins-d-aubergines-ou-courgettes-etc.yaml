titre: Gratins d'aubergines (ou courgettes, etc.)
type: salé
categories:
- plat
- accompagnement
vedettes:
- légumes
- fromage
ordre: 58
portions: Pour 4 personnes
ingredients:
- 4 aubergines
- 2 kg de petites tomates
- 2 oignons
- 4 gousses d'ail
- 4 boules de mozzarella
- 80 g de comté râpé
- Basilic, origan
- Huile d'olive
preparation:
- Cuire les aubergines coupées en bandes d’1 cm d’épaisseur à la vapeur pendant 10 minutes.
- Émincer les oignons et les gousses d'ail, puis les faire revenir dans une poêle pendant 10 minutes avec de l'origan.
- Ajouter les petites tomates.
- Préchauffer le four à 200°C.
- Dans un plat allant au four, verser une fine couche de sauce tomate et d'oignons. Ajouter une couche de lamelles d'aubergines avec de l'huile d'olive, puis une couche de mozzarella.
- Terminer avec une couche de sauce tomate et saupoudrer de comté râpé.
- Faire cuire au four pendant 20 minutes.
notes:
- titre: Astuce
  texte:
  - Si vous ne trouvez pas de petites tomates, vous pouvez les remplacer par de la sauce tomate. Vous pouvez également ajouter un peu de viande hachée ou de l'agneau pour un gratin plus consistant.
source: Carnet salé, p. 64
