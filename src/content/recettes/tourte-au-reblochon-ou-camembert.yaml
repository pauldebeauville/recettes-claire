titre: Tourte au reblochon (ou camembert)
type: salé
categories:
- plat
vedettes:
- fromage
ordre: 76
portions: Pour 4 personnes
ingredients:
- 1 reblochon (ou camembert, selon préférence)
- 1 pâte feuilletée
- 150 à 200 g de lardons
- 1 oignon
- 2 pommes de terre
- 1 jaune d’œuf
- 1 c. à soupe d’huile d’olive
preparation:
- titre: Cuisson des pommes de terre
  texte:
  - Épluchez les pommes de terre, coupez-les en rondelles et faites-les cuire dans de l’eau bouillante salée pendant 20 minutes. Égouttez et réservez.
- titre: Préparation de la garniture
  texte:
  - Épluchez et émincez l’oignon.
  - Faites chauffer l’huile d’olive dans une poêle, puis faites revenir les lardons (150 à 200 g selon votre goût) et l’oignon jusqu’à ce qu’ils soient dorés. Mélangez bien et réservez.
- titre: Préparation du fromage
  texte:
  - Enlevez la croûte du reblochon (ou camembert) et coupez-le en deux dans le sens de l’épaisseur.
- titre: Montage de la tourte
  texte:
  - Étalez la pâte feuilletée sur un plan de travail et badigeonnez-la d’un jaune d’œuf.
  - Au centre, disposez la première moitié du reblochon.
  - Ajoutez une couche de lardons et d’oignon, puis une couche de rondelles de pommes de terre.
  - Répétez les couches en terminant par la seconde moitié du reblochon.
- titre: Fermeture et cuisson
  texte:
  - Refermez la pâte feuilletée sur les côtés en veillant à bien sceller les bords.
  - Découpez un trou au centre pour permettre à la vapeur de s’échapper.
  - Badigeonnez le dessus de la pâte avec le reste du jaune d’œuf.
- Faites cuire au four préchauffé à 190 °C pendant 20 minutes, jusqu’à ce que la pâte soit bien dorée.
notes:
- titre: Conseil
  texte:
  - Servez cette tourte accompagnée d’une salade verte pour un repas gourmand et équilibré.
source: Carnet salé, p. 83
