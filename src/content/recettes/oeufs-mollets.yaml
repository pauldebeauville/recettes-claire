titre: Œufs mollets
type: salé
categories:
- base
vedettes:
- œufs
ordre: 116
ingredients:
- Œufs (selon le nombre de personnes)
preparation:
- Faites chauffer de l'eau dans une casserole jusqu'à ce qu'elle frémisse (elle ne doit pas bouillir).
- Plongez les œufs dans l'eau frémissante.
- Laissez cuire pendant 6 minutes.
- Sortez les œufs et plongez-les immédiatement dans de l'eau froide pour stopper la cuisson.
- Cassez délicatement les coquilles et servez.
source: Carnet salé, p. 127
