titre: Toasts au Saumon, Mangue et Avocat
type: salé
categories:
- apéritif
- entrée
vedettes:
- saumon
- fruits
ordre: 4
portions: Pour 4 personnes
ingredients:
- 4 tranches de pain (type toasts ou pain de campagne)
- 200 g de saumon fumé ou haddock (fumé ou fruité, selon votre choix)
- 1 mangue
- 2 avocats
- 1 poignée de salade verte
- 100 g de crème fraîche
- Huile d’olive
- ½ citron
- Sel et poivre
- Vinaigrette (facultatif)
preparation:
- titre: Préparer les toasts
  texte:
  - Découpez les tranches de pain en cercles ou gardez-les entières.
  - Faites-les dorer à la poêle ou passez-les sous le grill du four. Laissez refroidir.
- titre: Préparer les ingrédients
  texte:
  - Coupez le saumon fumé en lanières et aspergez-le d’un filet d’huile d’olive.
  - Coupez la mangue en lamelles ou en petits cubes.
  - Découpez la chair des avocats en dés, citronnez-les pour éviter qu’ils noircissent, puis ajoutez un filet d’huile d’olive et une pincée de sel.
- titre: Assembler les toasts
  texte:
  - Étalez une fine couche de crème fraîche sur les toasts refroidis.
  - Disposez dessus un peu de salade verte, les morceaux de saumon fumé, la mangue et l’avocat.
- titre: Assaisonnement
  texte:
  - Ajoutez une pincée de sel et de poivre sur chaque toast.
  - Si désiré, terminez avec un filet de vinaigrette.
- titre: Service
  texte:
  - Servez immédiatement en entrée ou en apéritif.
notes:
- titre: Astuce
  texte:
  - Ces toasts se marient bien avec une touche de piment d'Espelette pour relever les saveurs.
source: Carnet salé, p. 4
