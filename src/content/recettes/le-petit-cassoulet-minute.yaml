titre: Le Petit Cassoulet Minute
type: salé
categories:
- plat
vedettes:
- volaille
- viande
ordre: 99
portions: Pour 4 personnes
ingredients:
- 2 cuisses de canard confites
- 200 g de saucisse de Toulouse
- 2 carottes
- 1 oignon
- 2 gousses d'ail
- 2 feuilles de laurier
- 500 g de haricots blancs cuits en boîte
- 1 boîte de tomates concassées
- 4 biscottes
- 2 pincées de piment d'Espelette
- Sel, poivre
preparation:
- Faites dorer les cuisses de canard 10 minutes dans une poêle. Récupérez 2 cuillères à soupe de graisse rendue. Réservez les cuisses.
- Pelez et émincez les carottes et l'oignon. Écrasez 1 gousse d'ail. Faites revenir dans une sauteuse, dans la graisse réservée. Ajoutez les tomates concassées, les feuilles de laurier, et laissez mijoter environ 10 minutes.
- Coupez la saucisse en rondelles et faites-la cuire 10 à 15 minutes dans la poêle dégraissée.
- Ajoutez les haricots blancs dans la sauteuse avec de l'eau, puis les cuisses de canard. Laissez mijoter 10 minutes.
- Mixez les biscottes avec de l'ail et du poivre pour obtenir une chapelure. Faites dorer dans la poêle non utilisée.
- Parsemez le cassoulet de chapelure parfumée et de piment d'Espelette. Dégustez bien chaud.
source: Carnet salé, p. 108
