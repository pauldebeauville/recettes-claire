titre: Pâte à tarte à l’épeautre
type: salé
categories:
- base
ordre: 64
versions:
- nom: Version 1
  titre: Pâte à tarte à l’épeautre
  portions: Pour 4 personnes
  ingredients:
  - 250 g de farine d’épeautre
  - 5 g de sel
  - 125 g de beurre doux mou
  - 5 cl d’eau glacée
  - 1 jaune d’œuf
  preparation:
  - Dans un saladier, versez la farine et le sel. Mélangez bien.
  - Ajoutez le beurre coupé en morceaux. Mélangez du bout des doigts jusqu’à obtenir une texture de gros sable.
  - Incorporez l’eau glacée et le jaune d’œuf. Mélangez jusqu’à former une boule de pâte homogène.
  - Enveloppez la boule de pâte dans un film alimentaire et laissez reposer au réfrigérateur pendant 1 heure.
  - Sortez la pâte du réfrigérateur et attendez 10 minutes avant de l’étaler.
  - Étalez la pâte sur un plan de travail fariné, puis l’insérer dans un moule ou un cercle de 24 cm de diamètre.
  - Faites cuire au four préchauffé à 180 °C pendant 25 minutes ou jusqu’à ce que la pâte soit dorée.
  source: Carnet salé, p. 71
- nom: Version 2
  titre: Pâte à Tarte à l'Épeautre
  ingredients:
  - 270 g de farine d’épeautre
  - 9 cuillères à soupe de vin blanc ou de cidre
  - 4 ½ cuillères à soupe d'huile d'olive
  - 1 pincée de sel
  preparation:
  - Verser la farine dans un saladier, ajouter l'huile et le sel.
  - Mélanger à la main avec les doigts.
  - Étaler la pâte sur un plan de travail fariné.
  - Préchauffer le four à 180°C.
  - Cuire la pâte pendant 25 minutes.
  source: Carnet salé, p. 92
