titre: Crumble Express Abricots / Spéculoos
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 137
portions: Pour 4 personnes
ingredients:
- 800 g d’abricots
- 3 cuillères à soupe de sucre roux ou cassonade brune
- 1 paquet de spéculos en tous petits morceaux
preparation:
- Préchauffez le four à 180°C.
- Lavez les abricots sous un filet d’eau froide, coupez-les en deux et retirez le noyau.
- Placez les abricots dans un plat à four et saupoudrez-les de sucre roux ou cassonade. Remuez bien pour enrober les abricots.
- Émiettez les spéculoos sur les abricots. Vous pouvez ajuster la quantité selon vos préférences.
- Enfournez pendant 20 minutes jusqu’à ce que le crumble soit doré.
notes:
- texte:
  - Servez tiède ou froid, accompagné de glace à la vanille pour encore plus de gourmandise.
source: Carnet sucré, p. 20
