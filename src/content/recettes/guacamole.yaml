titre: Guacamole
type: salé
categories:
- apéritif
- sauce
vedettes:
- légumes
ordre: 46
portions: Pour 6 personnes
ingredients:
- 4 avocats mûrs et épluchés
- 4 cuillères à soupe de yaourt ou de fromage blanc
- 4 tomates pelées, sans pépins, concassées
- 4 cuillères à soupe de persil
- 4 cuillères à soupe de jus de citron vert
- 2 gousses d'ail écrasées
- Sel
preparation:
- Écraser les avocats à la fourchette et mettre en purée.
- Incorporer les autres ingrédients.
- Servir avec des toasts poêlés ou des crackers.
notes:
- titre: Astuce
  texte:
  - 'Si vous préparez à l’avance cette préparation, rajoutez les noyaux des avocats avec : pas d''oxydation.'
source: Carnet salé, p. 50
