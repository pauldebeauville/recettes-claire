titre: Clafoutis à la patate douce et à la pomme
type: salé
categories:
- plat
vedettes:
- légumes
ordre: 63
portions: Pour 4 personnes
ingredients:
- 4 c. à soupe d’huile d’olive
- 1 grosse patate douce (environ 300 g)
- 125 ml de lait ou de crème allégée
- 2 œufs
- Lardons
- 2 ou 3 pommes
- 30 g de noix de pécan
preparation:
- Préchauffez le four à 200 °C. Épluchez la patate douce et râpez-la.
- Chauffez 1 c. à soupe d’huile d’olive dans une poêle allant au four. Faites cuire la patate douce à feu moyen pendant environ 10 minutes.
- Pendant ce temps, épluchez les pommes, coupez-les en morceaux, et ajoutez-les à la poêle avec les lardons. Faites cuire 5 minutes supplémentaires.
- Dans un bol, mélangez la farine, le lait (ou la crème), les œufs, et une pincée de sel jusqu’à obtenir une pâte homogène.
- Hors du feu, versez cette préparation sur le mélange patate douce et pommes dans la poêle.
- Disposez les noix de pécan sur le dessus et enfournez. Faites cuire au four pendant 10 à 13 minutes, jusqu’à ce que le clafoutis soit légèrement doré.
- Laissez tiédir avant de servir.
notes:
- titre: Suggestion
  texte:
  - Accompagnez ce clafoutis d’une vinaigrette légère pour un contraste de saveurs.
source: Carnet salé, p. 70
