titre: Glace maison
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 130
portions: Pour 5 personnes
ingredients:
- 'Fraises (par ex.) : 500 g'
- 'Sucre : 12 cuillères à soupe'
- 'Crème fraîche : 125 g'
- 'Citron : 1/2 jus'
- 'Blanc d’œuf : 1 (pour éviter les paillettes)'
preparation:
- Mettre les fraises, le sucre, le jus de citron et la crème fraîche dans un mixeur.
- Mixer le tout jusqu’à obtenir une préparation homogène.
- Ajouter le blanc d’œuf pour éviter la formation de paillettes dans la glace.
- Verser la préparation dans un récipient adapté et mettre au congélateur.
- Laisser prendre pendant quelques heures en mélangeant de temps en temps pour une texture plus crémeuse.
source: Carnet sucré, p. 13
