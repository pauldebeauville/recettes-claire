titre: Pâte d’amande
type: sucré
categories:
- base
ordre: 122
ingredients:
- 'Sucre glace : 250 g'
- 'Amandes en poudre : 250 g'
- 'Blancs d’œufs : 2'
- 'Grand Marnier : 3 à 4 cuillères à soupe'
preparation:
- Dans un saladier, mélanger le sucre glace et la poudre d’amandes.
- Ajouter les 2 blancs d’œufs et le Grand Marnier.
- Pétrir le tout à la main jusqu’à obtenir une pâte homogène et malléable.
- Si la pâte est trop collante, ajouter un peu de sucre glace.
- Former une boule et laisser reposer quelques minutes avant utilisation.
source: Carnet sucré, p. 2
