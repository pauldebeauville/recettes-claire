titre: Toasts de Saumon Fumé au Concombre
type: salé
categories:
- apéritif
vedettes:
- saumon
ordre: 26
portions: Pour 4 personnes
ingredients:
- 4 toasts ronds (formés à l’aide d’un grand verre pour une belle présentation)
- 4 tranches de saumon fumé
- 1 concombre
- 4 c. à soupe de crème fraîche
- Jus d’un citron
- Sel, poivre
- Aneth (haché ou en pluches)
- Feuilles de salade pour la présentation
preparation:
- titre: Préparer les toasts
  texte:
  - Faites griller les toasts ronds sur un seul côté dans une poêle avec un mélange de beurre et d’huile.
- titre: Préparer la base
  texte:
  - Disposez les feuilles de salade sur un grand plat de service.
  - Étalez une fine couche de crème fraîche sur chaque toast.
- titre: Ajouter le saumon et le concombre
  texte:
  - Déposez une tranche de saumon fumé sur chaque toast. Assaisonnez avec un filet de jus de citron, une pincée de sel et de poivre.
  - Au centre de chaque toast, ajoutez une cuillère à soupe de concombre finement coupé, préalablement mélangé avec une touche de crème fraîche.
- titre: Décoration et service
  texte:
  - Saupoudrez chaque toast d’un peu d’aneth pour la touche finale.
  - Disposez les toasts sur le lit de salade et servez immédiatement.
source: Carnet salé, p. 26
