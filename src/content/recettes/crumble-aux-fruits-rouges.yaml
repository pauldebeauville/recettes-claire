titre: Crumble aux Fruits Rouges
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 135
portions: Pour 4 personnes
ingredients:
- 60 g de farine d'épeautre
- 60 g de beurre 1/2 sel, froid et coupé en morceaux
- 40 g d’amandes effilées
- 60 g de sucre en poudre
- 1 barquette de framboises, fraises ou myrtilles
- 2 cuillères à soupe de sucre en poudre (pour les fruits)
preparation:
- Préchauffez le four à 180°C.
- 'Dans un saladier, mélangez du bout des doigts : la farine, les amandes et le beurre froid coupé en morceaux. La pâte doit rester grumeleuse, et rajouter le sucre. Mélangez. Si la pâte est collante, la mettre au frais quelques minutes avant de la cuire.'
- titre: Préparez les fruits
  texte:
  - Lavez les fruits rouges et déposez-les dans un plat à four.
  - Saupoudrez-les de 2 cuillères à soupe de sucre en poudre et cuire 15 minutes.
- Émiettez la pâte à crumble uniformément sur les fruits.
- Enfournez pendant 25 à 30 minutes jusqu’à ce que le crumble soit doré.
- Surveillez la cuisson et ajustez selon vos préférences.
notes:
- texte:
  - 'PS : augmenter un peu les quantités du crumble'
  - Servez tiède ou froid. Parfait avec une boule de glace à la vanille ou une crème fouettée !
source: Carnet sucré, p. 18
