titre: Magret de Canard Rôti, Sauce au Miel de Sarrasin et au Vinaigre de Cidre
type: salé
categories:
- plat
vedettes:
- volaille
ordre: 41
portions: Pour 4 personnes
ingredients:
- 2 magrets de canard
- 200 g d'oignons
- 100 g de miel de sarrasin
- 15 g de beurre
- 10 cl de vinaigre de cidre
- 10 cl d'eau
- Sel, poivre
- Ciboulette (pour décorer)
preparation:
- section: Préparation de la sauce
- Éplucher et ciseler finement les oignons (5 mm).
- Faire chauffer le beurre dans une casserole et ajouter les oignons. Les faire suer légèrement et verser le miel.
- Laisser cuire jusqu’à ce qu’il prenne une légère coloration caramel, puis ajouter le vinaigre de cidre. Laisser cuire encore 5 min. Ajouter 10 cl d'eau et assaisonner, ne pas hésiter à bien poivrer.
- Faire bouillir et réserver au chaud.
- section: Cuisson des magrets
- Préchauffer le four à 200°C (Th. 7).
- Entailler la graisse des magrets de façon à obtenir un damier (des carrés d’environ 1 cm de côté). Ne pas couper la chair.
- Faire chauffer une poêle sans matière grasse et y déposer les magrets côté peau. Laisser cuire pendant 5 min (jusqu’à ce que la graisse soit fondue et que la peau soit légèrement colorée).
- Glisser les magrets dans un plat à rôtir et laisser cuire 8 min au four à 200°C (Th. 7).
- section: Dressage
- Tailler les magrets en fines tranches légèrement de biais (en suivant les fibres de la viande).
- Partager ces tranches entre chaque assiette et napper les magrets avec la sauce au miel. Décorer avec de la ciboulette. Servir aussitôt.
source: Carnet salé, p. 45
