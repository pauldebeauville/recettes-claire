titre: Gratin de Pommes de Terre
type: salé
categories:
- accompagnement
vedettes:
- légumes
ordre: 95
portions: Pour 4 portions
temps:
- label: Préparation
  valeur: 25 min
ingredients:
- 1 kg de pommes de terre
- 60 g de fromage râpé (ou 100 g de raclette)
- 25 cl de crème fraîche (augmenter la crème fraîche qui s'ajoute avec un œuf)
- 30 g de beurre (ou 4 noix de beurre)
- 1 gousse d'ail surgelée (ou 1 c. à café d'ail en cube surgelé)
- Sel
preparation:
- Éplucher et couper en fines rondelles les pommes de terre.
- Frotter le plat à gratin avec la gousse d'ail surgelée.
- Disposer successivement les rondelles de pommes de terre, le fromage râpé, la crème, saler. Recommencer jusqu'en haut du plat pour finir sur une couche de pommes de terre.
- Ajouter une noix de beurre.
- Faites cuire à 200°C (Thermostat 6) pendant 50 minutes, puis 5 minutes à 240°C (Thermostat 8).
- Déguster aussitôt.
source: Carnet salé, p. 104
