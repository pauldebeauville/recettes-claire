titre: Rognons de veau au curry
type: salé
categories:
- plat
vedettes:
- viande
ordre: 50
portions: Pour 6 personnes
ingredients:
- 3 rognons de veau
- 2 oignons
- 2 pommes fruits
- 60 g de beurre
- 2 cuillères à soupe de curry
- 10 g de farine
- 1/2 litre d'eau environ
- 100 g de crème fraîche
- 1 cl de cognac
- 1 cuillère à soupe d'huile
- Sel, poivre
preparation:
- Otez toute la graisse des rognons, coupez-les en petits morceaux, réservez-les.
- Épluchez les oignons, émincez-les finement, faites-les fondre dans la moitié du beurre.
- Épluchez les pommes, coupez-les en dés, ajoutez-les aux oignons, laissez cuire ensemble 10 minutes.
- Saupoudrez le tout de curry et de farine, mélangez rapidement et mouillez à hauteur.
- Salez, poivrez et faites cuire 30 minutes. Passez la moulinette grille fine, réservez cette sauce.
- Dans une poêle, avec 1 cuillère à soupe d'huile et 30 g de beurre, faites revenir à feu vif les rognons pendant 5 minutes. Versez le cognac, flamber.
- Otez les rognons, réservez-les au chaud.
- Dans la poêle, versez la sauce au curry et la crème, laissez réduire d’un quart sur feu vif.
- Ajoutez les rognons, juste pour les réchauffer.
- Servez avec un riz sauvage.
source: Carnet salé, p. 54
