titre: Sauté de veau à la Lisboanaise
type: salé
categories:
- plat
vedettes:
- viande
ordre: 42
portions: Pour 8 personnes
ingredients:
- 1600 g de sauté de veau ou de tendrons
- 300 g de chorizo entier
- 12 pommes de terre
- 4 petites poignées d'olives noires (prendre un bocal)
- 4 petites boîtes de concentré de tomates
- 4 verres de porto
- 1 verre d'eau
- 4 oignons
- 4 gousses d'ail
- 4 pincées de thym
- Poivre
- Sel
preparation:
- Cuire les pommes de terre à l'eau pendant 30 à 50 minutes.
- Dans une cocotte, faire revenir l'oignon émincé dans un filet d'huile d'olive. Assaisonner. Ajouter l'ail, une branche de thym, le porto et l'eau pour déglacer. Retirer le tout de la cocotte.
- À place, mettre à nouveau un filet d'huile d'olive et faire revenir la viande pour bien la dorer. Ajouter le concentré de tomates.
- Puis remettre les oignons et le porto. Baisser le feu. Ajouter les olives et le chorizo en rondelles.
- Laisser mijoter 1h20 à feu doux. En fin de cuisson, retirer les branches de thym et ajouter les pommes de terre pelées.
source: Carnet salé, p. 46
