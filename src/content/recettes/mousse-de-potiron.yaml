titre: Mousse de Potiron
type: salé
categories:
- accompagnement
vedettes:
- légumes
ordre: 92
portions: Pour 4 personnes
ingredients:
- 800 g de potiron
- 2 oignons
- 1 gousse d'ail
- 2 branches de thym
- 1 c. à soupe de sel
- 2 cubes de Salakis
- Beaucoup d'herbes fraîches (au dernier moment)
preparation:
- Éplucher le potiron et le couper en petits morceaux.
- Éplucher les oignons, les hacher finement, puis les faire revenir à la poêle avec un peu d'huile d'olive.
- Ajouter le potiron coupé en morceaux, l'ail écrasé, les branches de thym et 1 c. à soupe de sel.
- Faire cuire à feu doux pendant environ 20 minutes, jusqu'à ce que le potiron soit bien tendre.
- Ajouter les cubes de Salakis et mixer le tout jusqu'à obtenir une texture lisse et crémeuse.
- Ajouter beaucoup d'herbes fraîches hachées au dernier moment.
- Saler à votre goût et servir immédiatement.
source: Carnet salé, p. 101
