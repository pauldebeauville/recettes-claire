titre: Crumble aux Deux Saumons
type: salé
categories:
- plat
vedettes:
- saumon
ordre: 31
portions: Pour 6 personnes
ingredients:
- groupe: Pour la garniture
- 500 g de saumon cru
- 200 g de saumon fumé
- 500 g de poireaux (entiers, bien essorés)
- 200 g de courgettes (ou 1 grosse courgette)
- 30 g d’huile de noix de coco (ou de beurre)
- groupe: Pour le crumble
- 100 g de farine
- 100 g de parmesan râpé
- 100 g de beurre froid salé
- 40 g de chapelure
- 2 zestes de citron vert
preparation:
- titre: Préparer les légumes
  texte:
  - Préchauffez le four à 180°C.
  - Émincez finement les blancs de poireaux et coupez les courgettes en fine julienne.
  - Dans une sauteuse, faites fondre l’huile de noix de coco. Faites revenir les poireaux et les courgettes à feu doux pendant 5 minutes. Salez et poivrez.
- titre: Préparer les saumons
  texte:
  - Coupez le saumon cru et le saumon fumé en petits morceaux.
  - Ajoutez-les dans la sauteuse avec les légumes et mélangez bien.
  - Versez le tout dans un plat à gratin.
- titre: Préparer la pâte à crumble
  texte:
  - Dans un saladier, mélangez la farine, le parmesan, la chapelure et le beurre froid coupé en petits morceaux. Travaillez avec les mains pour obtenir une texture de "gros sable".
  - Si vous utilisez du beurre doux, ajoutez une pincée de sel.
- titre: Assembler et cuire
  texte:
  - Recouvrez la préparation légumes/saumons avec la pâte à crumble.
  - Faites cuire au four pendant 30 minutes, jusqu’à ce que le crumble soit bien doré.
- titre: Finition
  texte:
  - À la sortie du four, ajoutez 2 zestes de citron vert râpés sur le dessus pour une touche de fraîcheur.
- titre: Service
  texte:
  - Servez le crumble chaud, accompagné d’une salade verte.
source: Carnet salé, p. 32
