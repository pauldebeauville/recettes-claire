titre: Quiche salée
type: salé
categories:
- plat
vedettes:
- légumes
- œufs
ordre: 61
portions: Pour 4 personnes
ingredients:
- 1 pâte feuilletée Herta
- 2 courgettes
- 5 tomates
- 5 œufs
- 1 échalote
- 1 gousse d'ail
- Basilic, sel, poivre
- Huile d'olive
- 100 g de mozzarella au chèvre
- 50 cl de crème fraîche
preparation:
- Mettre la pâte feuilletée Herta dans un moule à tarte (ne pas utiliser de moule Flexipan) et cuire 10 minutes à blanc.
- Cuire les courgettes et les tomates à la vapeur, puis faire revenir dans un peu d'huile d'olive.
- Verser les légumes cuits dans un plat, puis ajouter les œufs battus, la crème fraîche, le sel et le poivre. Mélanger.
- Disposer des rondelles de mozzarella ou de chèvre sur le dessus, puis enfourner à 180°C pendant 15 minutes environ.
source: Carnet salé, p. 68
