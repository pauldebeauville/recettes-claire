titre: Pesto à la menthe
type: salé
categories:
- sauce
ordre: 115
ingredients:
- 20 feuilles de menthe
- 60 g de pignons de pin
- 30 g de parmesan râpé
- Sel (selon votre goût)
- 250 ml d'huile d'olive
preparation:
- Dans le bol du mixeur, mettez la menthe et les pignons de pin.
- Ajoutez le parmesan, puis mixez le tout.
- Ajoutez progressivement l'huile d'olive tout en continuant de mixer jusqu'à l'obtention d'une texture lisse et homogène.
- Salez selon votre goût.
notes:
- texte:
  - Votre pesto à la menthe est prêt à être servi ! Il peut accompagner des pâtes, des légumes ou d'autres plats.
source: Carnet salé, p. 126
