titre: Parfait de Saumon
type: salé
categories:
- entrée
vedettes:
- saumon
ordre: 15
portions: Pour 6 personnes
temps:
- label: Temps de préparation
  valeur: 10 minutes (+ plusieurs heures au réfrigérateur)
intro:
- Entrée Gastronomique
ingredients:
- 300 g de saumon fumé (demander des chutes pour la mousse)
- 3 belles tranches de saumon fumé (norvégien)
- 10 g d’œufs de saumon
- 2 dl de crème fleurette
- ½ concombre
- 2 branches de fenouil (ou du fenouil frais)
- 1 c. à soupe d’huile d’olive
- 1 c. à soupe de vinaigre de vin
- Sel, poivre
- 'Matériel : un moule à manqué de 18 cm de diamètre et 2½ cm de haut'
preparation:
- titre: Préparation du parfait
  texte:
  - Placez le bol du mixeur et la crème fleurette au réfrigérateur pendant 1 heure pour qu’ils soient bien froids.
  - Dans le bol refroidi, versez la crème fleurette, les chutes de saumon fumé, et ajoutez quelques tours de moulin à poivre. Mixez jusqu’à obtenir une crème onctueuse et ferme.
  - Tapissez le moule avec les tranches de saumon fumé en les laissant déborder des bords.
  - Versez la mousse de saumon dans le moule en tassant bien. Rabattez les tranches de saumon sur le dessus pour refermer le parfait.
  - Placez le moule au réfrigérateur pendant 2 heures.
- titre: Préparer la sauce au concombre
  texte:
  - Épluchez, épépinez et coupez le concombre en tronçons.
  - Mixez le concombre avec l’huile d’olive, le vinaigre, une pincée de sel et de poivre. Réduisez jusqu’à obtenir une sauce lisse.
- titre: Finition et service
  texte:
  - Démoulez le parfait sur un plat de service. Décorez avec les branches de fenouil et les œufs de saumon.
  - Servez entouré de la sauce au concombre, accompagné d’un filet de citron si souhaité.
notes:
- titre: Farce
  texte:
  - 'Pour enrichir le parfait, préparez une farce :'
  - Mixez 220 g de saumon ou truite fumée avec 2½ tasses à café de crème fraîche et un filet de citron.
  - Mélangez jusqu’à obtenir une consistance homogène et ajoutez-la à la mousse pour un plat encore plus savoureux.
source: Carnet salé, p. 15
