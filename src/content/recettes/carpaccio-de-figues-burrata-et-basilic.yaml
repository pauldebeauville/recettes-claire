titre: Carpaccio de Figues, Burrata et Basilic
type: salé
categories:
- entrée
vedettes:
- fruits
- fromage
ordre: 97
ingredients:
- Figues
- Basilic
- Vinaigre de Xérès
- Huile d'olive
- Jambon cru (facultatif)
- Parmesan
preparation:
- Éplucher les figues, puis les couper en tranches fines.
- Ajouter un filet d'huile d'olive, du sel et du poivre.
- Déposer un peu de roquette, couper la burrata, ajouter le basilic, l'huile d'olive et un peu de vinaigre de Xérès.
- Saler légèrement.
- Vous pouvez aussi ajouter du jambon cru en morceaux ou bien du fromage de type parmesan ou gorgonzola.
- Pour une entrée, comptez 1 figue par personne. Pour un dîner, 3 figues par personne.
source: Carnet salé, p. 106
