titre: Tartare de saumon au pamplemousse chinois
type: salé
categories:
- entrée
vedettes:
- saumon
ordre: 37
portions: Pour 4 personnes
ingredients:
- 600 g de filet de saumon cru (sans la peau)
- 1 pamplemousse chinois
- 2 cuil. à soupe d'huile d'olive
- 1 citron
- 1 citron vert
- Gros sel
- Aneth
preparation:
- titre: Préparer le saumon
  texte:
  - Découpez le saumon en très petits cubes ou hachez-le finement avec un couteau (évitez le mixeur).
  - Mettez le saumon dans un saladier.
  - Zestez le citron et le citron vert avec une râpe fine pour un meilleur résultat, puis ajoutez les zestes au saumon.
  - Ajoutez ½ cuil. à café de gros sel, du poivre, et de l'aneth ciselé. Mélangez délicatement.
  - Laissez mariner avec les zestes au frais pendant au moins 2 heures sans ajouter le jus de citron pour éviter que le saumon ne blanchisse ou ne cuise.
- titre: Préparer le pamplemousse
  texte:
  - Pelez le pamplemousse à vif en enlevant la peau blanche.
  - Séparez chaque quartier en passant un couteau fin entre les membranes et coupez-les en petits dés.
- titre: Finalisation
  texte:
  - Au moment de servir, ajoutez les dés de pamplemousse au saumon.
  - Mélangez délicatement pour conserver la texture crue du saumon.
- titre: Présentation
  texte:
  - Servez avec des œufs de saumon et des tranches de pain grillé.
source: Carnet salé, p. 40
