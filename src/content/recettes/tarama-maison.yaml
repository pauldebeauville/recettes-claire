titre: Tarama Maison
type: salé
categories:
- apéritif
vedettes:
- poisson
ordre: 27
portions: Pour 3-4 personnes
ingredients:
- 2 toasts par personne
- 1 poche d’œufs de cabillaud
- 3 c. à soupe de crème fraîche (type Elle & Vire)
- Jus de ½ citron
preparation:
- titre: Préparer les toasts
  texte:
  - Faites griller les toasts dans une poêle avec un peu de beurre jusqu’à ce qu’ils soient dorés. Réservez.
- titre: Préparer le tarama
  texte:
  - Retirez la peau de la poche d’œufs de cabillaud.
  - Écrasez les œufs finement à l’aide d’une fourchette.
  - Ajoutez la crème fraîche et le jus de citron.
  - Mélangez le tout au fouet électrique ou à la main jusqu’à obtenir une texture homogène.
- titre: Service
  texte:
  - Servez le tarama sur les toasts grillés, accompagné d’une salade en entrée ou comme apéritif.
  - Vous pouvez également l’utiliser comme dip avec des crudités.
source: Carnet salé, p. 27
