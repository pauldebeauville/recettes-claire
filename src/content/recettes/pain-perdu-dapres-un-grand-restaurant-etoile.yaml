titre: Pain Perdu (d’après un grand restaurant étoilé)
type: sucré
categories:
- dessert
ordre: 154
portions: Pour 5 personnes
ingredients:
- 20 cl de crème liquide
- 20 cl de lait
- 4 jaunes d'œufs
- 90 g de sucre en poudre
- 20 g de beurre + huile pour la poêle
- Tranches de toast briochés (selon envie)
preparation:
- titre: Préparez l’appareil à pain perdu
  texte:
  - Dans un saladier, battez les jaunes d'œufs avec le sucre.
  - Incorporez progressivement le lait et la crème tout en mélangeant.
- titre: Cuisson
  texte:
  - Faites chauffer une poêle avec le mélange beurre et huile.
  - Trempez les tranches de pain brioché dans le mélange, sans les laisser s’imbiber trop longtemps.
  - Faites cuire les toasts dans la poêle environ 4 à 5 minutes de chaque côté, jusqu’à ce qu’ils soient dorés et croustillants.
- titre: Finition et service
  texte:
  - Servez les toasts avec une boule de glace vanille, des pommes poêlées, un filet de caramel maison ou des fruits rouges comme des framboises.
source: Carnet sucré, p. 42
