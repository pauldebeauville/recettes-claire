titre: Roulé au Saumon et Épinards
type: salé
categories:
- entrée
- apéritif
vedettes:
- saumon
ordre: 38
portions: Pour 4 personnes
ingredients:
- 500 à 600 g d'épinards surgelés
- 5 œufs
- 250 g de fromage ail et fines herbes
- 250 g de saumon fumé
preparation:
- Décongeler les épinards et, si nécessaire, bien les égoutter.
- Battre les œufs en omelette, puis y incorporer les épinards. Saler et poivrer.
- Étaler ce mélange sur une plaque et légèrement huiler. Mettre au four pendant 15 minutes à 200°C.
- Sortir du four, étaler du fromage ail et fines herbes sur la pâte d'épinards, puis ajouter les morceaux de saumon fumé.
- Rouler ensuite comme un "boudin" de film. Mettre au réfrigérateur pendant au moins 1 heure.
- Couper en tranches épaisses et servir.
source: Carnet salé, p. 41
