titre: Saumon Fumé à la Farce de Courgettes
type: salé
categories:
- entrée
vedettes:
- saumon
- légumes
ordre: 22
portions: Pour 4 personnes
ingredients:
- 4 courgettes (1 courgette + ½ par personne)
- 4 tranches de saumon fumé
- 1 échalote
- 1 gousse d’ail
- 20 g de beurre salé
preparation:
- titre: Préparer les courgettes
  texte:
  - Lavez les courgettes et râpez-les.
  - Essuyez-les avec du papier absorbant pour enlever l’excès d’eau.
- titre: Cuisson de la farce
  texte:
  - Faites chauffer le beurre salé dans une poêle.
  - Ajoutez les courgettes râpées, l’échalote finement hachée et l’ail écrasé.
  - Faites sauter à feu moyen jusqu’à ce que les courgettes soient tendres.
- titre: Assembler les roulés
  texte:
  - Disposez une tranche de saumon fumé à plat.
  - Garnissez l’intérieur avec une portion de la farce de courgettes.
  - Roulez délicatement la tranche de saumon pour former un roulé.
- titre: Service
  texte:
  - Disposez les roulés sur un plat de service.
  - Servez frais, idéalement accompagné d’une salade verte.
source: Carnet salé, p. 22
