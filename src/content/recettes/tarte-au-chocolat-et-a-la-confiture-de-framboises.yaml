titre: Tarte au Chocolat et à la Confiture de framboises
type: sucré
categories:
- dessert
vedettes:
- chocolat
- fruits
ordre: 147
portions: Pour 8 personnes
ingredients:
- groupe: Fond de tarte
- 300 g de biscuits sablés (type Traou Mad)
- 60 g de beurre mou
- groupe: Crème au chocolat
- 32 cl de crème fraîche liquide
- 2 cuillères à soupe rase de sucre
- 115 g de beurre doux
- 455 g de chocolat noir (70% de cacao)
- 10 cl de lait
- groupe: Garniture
- 325 g de confiture de framboises
- Cacao en poudre (pour la finition)
preparation:
- section: Préparation du fond de tarte
- Mixez les biscuits sablés pour les réduire en poudre.
- Incorporez le beurre mou et mélangez jusqu’à obtenir une pâte homogène.
- Étalez cette pâte dans un moule à tarte beurré (Ø 20 cm) en appuyant fermement pour bien tasser. Placez au réfrigérateur pour qu’elle prenne.
- section: Préparation de la crème au chocolat (ganache)
- Concassez le chocolat en petits morceaux et réservez.
- Dans une casserole, faites chauffer la crème et le sucre jusqu’à frémissement.
- Hors du feu, ajoutez le chocolat concassé et mélangez délicatement pour le faire fondre.
- Incorporez le beurre doux et mélangez jusqu’à obtention d’une crème lisse en incorporant petit à petit le lait.
- section: Montage et finition
- Sortez le fond de tarte du réfrigérateur et recouvrez-le uniformément de confiture de framboises.
- Versez la crème au chocolat par-dessus en lissant bien à l’aide d’une spatule.
- Replacez la tarte au réfrigérateur pendant au moins 2 heures pour qu’elle prenne.
- Saupoudrez de cacao en poudre avant de servir.
notes:
- titre: Dégustation
  texte:
  - Sortez la tarte du réfrigérateur 20 minutes avant la dégustation pour qu’elle révèle toutes ses saveurs. Saupoudrez-la de cacao et présentez-la au centre de la table pour un effet gourmand assuré.
  - Une tarte élégante et délicieuse, alliant l’intensité du chocolat noir à la douceur de la confiture de framboises.
source: Carnet sucré, p. 32-33
