titre: Curry d'agneau
type: salé
categories:
- plat
vedettes:
- viande
ordre: 45
portions: Pour 4 à 6 personnes
ingredients:
- 1 kg de gigot désossé
- 1 c. s. de ghee (beurre clarifié) ou d'huile végétale
- 2 oignons hachés
- 125 g de yaourt nature
- 1 c. c. de piment en poudre
- 1 c. s. de coriandre en poudre
- 2 c. c. de cumin en poudre
- 2 c. c. de cardamome en poudre
- 1/2 c. c. de clous de girofle en poudre
- 1 c. c. de curcuma en poudre
- 3 gousses d'ail pilées
- 400 g de tomates concassées en conserve
- 1 c. c. de sel
- 30 g d'amandes effilées
- 1 c. c. de garam masala
- Quelques feuilles de coriandre ciselées
preparation:
- Dégraissez l'agneau et coupez-le en cubes de 2,5 cm.
- Faites chauffer le ghee dans une grande casserole et faites-y fondre l'oignon 5 minutes, en remuant sans cesse. Incorporez le yaourt, le piment, la coriandre, le cumin, la cardamome, le clou de girofle, le curcuma, l'ail et le gingembre. Ajoutez la tomate et 1 cuillère à café de sel ; laissez mijoter 5 minutes.
- Ajoutez l'agneau et remuez pour bien l'enrober de la préparation. Couvrez et laissez cuire à feu doux 1 h 30, jusqu'à ce que l'agneau soit tendre. Retirez le couvercle et laissez réduire jusqu'à ce que la sauce ait épaissi.
- Pendant ce temps, faites griller les amandes à sec dans une poêle pendant 3 à 4 minutes, en secouant légèrement l'ustensile. Quand les amandes sont dorées, retirez-les de la poêle pour qu'elles ne brûlent pas.
- Incorporez le garam masala à la préparation à l'agneau, mélangez soigneusement. Parsemez le plat d'amandes grillées et de coriandre ciselée avant de servir.
source: Carnet salé, p. 49
