titre: Caramel pour Crème Brûlée
type: sucré
categories:
- dessert
ordre: 139
ingredients:
- groupe: Caramel
- 80 g de sucre
- 1 cuillère à soupe d'eau pour 2 personnes (avec plat à four individuel spécial)
preparation:
- Faire cuire la crème normalement, puis la mettre au frigidaire (elle doit-être très froide).
- Faire un caramel dans une casserole.
- Versez le caramel sur la surface de la crème brulée rapidement.
- Le caramel brûlant va se fixer sur la crème
source: Carnet sucré, p. 22
