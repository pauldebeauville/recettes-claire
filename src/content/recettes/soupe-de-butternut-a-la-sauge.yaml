titre: Soupe de butternut à la sauge
type: salé
categories:
- soupe
vedettes:
- légumes
ordre: 68
portions: Pour 4 personnes
ingredients:
- 1 courge butternut (environ 1 kg)
- 1 c. à soupe d’huile d’olive ou de noix
- 1 oignon
- 6 feuilles de sauge
- 1 litre de bouillon de légumes
- 50 g de crème fraîche (facultatif)
- 4 burratas ou petites burratinas
- 30 g de noisettes grillées
- 1 c. à soupe d’huile d’olive (pour la finition)
- Sel et poivre
preparation:
- Épluchez la courge, retirez les pépins et coupez-la en morceaux.
- Émincez l’oignon.
- Dans une grande casserole, faites chauffer l’huile d’olive. Ajoutez l’oignon, les feuilles de sauge, et les morceaux de courge. Faites revenir à feu vif pendant 3 à 4 minutes, en mélangeant régulièrement.
- Ajoutez le bouillon de légumes, puis laissez cuire à feu doux pendant environ 30 minutes, jusqu’à ce que les morceaux de courge soient bien tendres.
- Mixez la préparation jusqu’à obtenir une texture lisse et homogène. Ajoutez la crème fraîche si vous le souhaitez, puis rectifiez l’assaisonnement avec du sel et du poivre.
- Servez la soupe chaude dans des bols. Ajoutez une burrata dans chaque bol, parsemez de noisettes grillées et de feuilles de sauge pour la décoration.
- Terminez avec un filet d’huile d’olive pour la finition.
notes:
- titre: Conseil
  texte:
  - Accompagnez cette soupe de pain grillé ou de petits croûtons pour plus de gourmandise.
source: Carnet salé, p. 75
