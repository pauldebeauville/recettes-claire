titre: Tarte aux Sardines et Tomates
type: salé
categories:
- plat
vedettes:
- poisson
ordre: 17
portions: Pour 4 personnes
ingredients:
- 1 pâte feuilletée (type Herta)
- 8 tomates (ou du coulis de tomates si hors saison)
- 2 boîtes de sardines Belle Iloise à l’ail et tomate
- 1 c. à soupe de moutarde
- 1 oignon
- 1 gousse d’ail
- 1 échalote
- 250 g de comté (en lamelles ou râpé)
- Basilic (facultatif)
preparation:
- titre: Préparer la pâte
  texte:
  - Déroulez la pâte feuilletée dans un moule à tarte (type Flexipan).
  - Faites-la cuire à blanc au four préchauffé à 150°C jusqu’à ce qu’elle soit légèrement dorée.
- titre: Ajouter la moutarde
  texte:
  - À la sortie du four, badigeonnez la pâte avec une fine couche de moutarde à l’aide d’un pinceau.
- titre: Préparer la garniture
  texte:
  - Faites revenir les tomates (coupées en morceaux), l’oignon, l’ail et l’échalote à la poêle avec un filet d’huile d’olive.
  - Si les tomates sont hors saison, utilisez un coulis de tomates à la place pour plus de saveur.
- titre: Assembler la tarte
  texte:
  - Étalez la purée de tomates sur la pâte.
  - Disposez les sardines tout autour de la tarte.
  - Ajoutez les lamelles ou le comté râpé sur le dessus.
  - Ajoutez du basilic, si souhaité.
- titre: Cuisson finale
  texte:
  - Remettez la tarte au four pendant 5 minutes à 180°C pour réchauffer l’ensemble.
- titre: Service
  texte:
  - Servez chaud, accompagné d’une salade verte.
notes:
- titre: Astuce
  texte:
  - Vous pouvez enrichir la recette avec quelques olives ou herbes fraîches pour une touche méditerranéenne.
source: Carnet salé, p. 17
