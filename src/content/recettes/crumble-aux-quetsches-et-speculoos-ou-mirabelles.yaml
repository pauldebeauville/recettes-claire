titre: Crumble aux Quetsches et Spéculoos ou Mirabelles
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 136
portions: Pour 6/8 personnes
ingredients:
- 1 kg de mirabelles ou de quetsches
- 150 g de farine
- 150 g de sucre en poudre + 2 cuillères à soupe pour les fruits
- 150 g de beurre froid
- 8 spéculoos
- Glace à la vanille
preparation:
- Préchauffez le four à 180°C.
- Coupez les mirabelles ou les quetsches en deux pour retirer le noyau. Disposez-les dans un plat à four. Saupoudrez-les de 2 cuillères à soupe de sucre.
- Dans un saladier, versez la farine et le sucre. Ajoutez le beurre froid coupé en petits morceaux et les spéculoos écrasés (en gardant quelques morceaux).
- Mélangez le tout du bout des doigts pour obtenir un "gros sable".
- Répartissez cette pâte à crumble uniformément sur les fruits.
- Enfournez pendant 25 minutes jusqu’à ce que le crumble soit doré.
notes:
- texte:
  - Servez tiède ou froid, accompagné de glace à la vanille pour une touche gourmande.
source: Carnet sucré, p. 19
