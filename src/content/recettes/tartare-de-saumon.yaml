titre: Tartare de Saumon
type: salé
categories:
- entrée
vedettes:
- saumon
ordre: 10
portions: Pour 4 à 5 personnes (entrée)
ingredients:
- 2 brins d’aneth (ou plus si surgelé)
- 1 c. à café de baies roses écrasées (sans les graines noires)
- 300 g de filet de saumon frais (sans peau)
- 100 g de saumon fumé en petits morceaux
- Jus d’un citron vert
- 2 à 3 c. à soupe d’huile d’olive
- 1 c. à café de sel
- Poivre
- 1 pincée d’ail en poudre (facultatif)
- 10 cl de crème fraîche
preparation:
- titre: Préparer les arômes
  texte:
  - Dans un robot (Thermomix ou autre), mixez les baies roses et l’aneth pendant 5 secondes à vitesse 6. Raclez les bords si nécessaire.
- titre: Mixer le saumon fumé
  texte:
  - Ajoutez les morceaux de saumon fumé, le jus de citron, l’huile d’olive, le sel, le poivre et l’ail (si utilisé). Mixez pendant 4 secondes à vitesse 5 pour obtenir une texture homogène. Transférez dans un saladier.
- titre: Ajouter le saumon frais
  texte:
  - Incorporez les morceaux de saumon frais finement coupés et mélangez délicatement avec la crème fraîche.
- titre: Dressage
  texte:
  - À l’aide d’un cercle de présentation, disposez le tartare dans les assiettes. Garnissez avec des herbes fraîches, des baies roses ou des olives pour la décoration.
notes:
- titre: Astuce
  texte:
  - Doublez les quantités pour servir ce tartare dans un grand plat à partager.
source: Carnet salé, p. 10
