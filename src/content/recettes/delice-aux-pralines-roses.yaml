titre: Délice aux Pralines Roses
type: sucré
categories:
- dessert
ordre: 141
ingredients:
- 200 g de beurre fin mou
- 100 g de sucre glace
- 100 g de pralines roses de très bonne qualité ou 24 pralines roses
- 1/2 dl de cognac
- Quelques pralines pour la décoration
preparation:
- Mixez le beurre jusqu’à obtention d’une crème lisse.
- Ajoutez le sucre glace et mélangez bien.
- Versez le cognac et incorporez-le à la préparation.
- Écrasez les pralines roses en miettes et mélangez-les à la crème.
- titre: Utilisation
  texte:
  - Fourrez des petites crêpes avec cette crème ou passez-les au four au dernier moment jusqu’à obtention d’une crème légèrement liquide.
- Saupoudrez de miettes de pralines pour la décoration.
notes:
- titre: Astuce
  texte:
  - Cette crème peut aussi être utilisée en alternance avec des biscuits fins, sous forme de couches successives (comme le moka au café).
source: Carnet sucré, p. 24
