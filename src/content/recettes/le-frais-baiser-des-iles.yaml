titre: Le Frais Baiser des Îles
type: sucré
categories:
- dessert
vedettes:
- chocolat
- fruits
ordre: 126
portions: Pour 8 personnes
intro:
- Grand prix de la Poêle d’Or
ingredients:
- 8 poires pochées au sirop
- groupe: Glace au chocolat
- 'Lait : 1/2 litre'
- 'Crème : 1/2 litre'
- 'Jaunes d’œufs : 10'
- 'Sucre : 300 g'
- 'Cacao amer : 80 g'
- groupe: Sabayon au rhum
- 'Vin blanc : 4 dl'
- 'Rhum : 1 dl'
- 'Jaunes d’œufs : 8'
- 'Sucre : 150 g'
- 'Gélatine : 2 feuilles'
- 'Crème Chantilly : 1/4 de litre (+ 1 tasse pour décorer)'
- groupe: Glace aux marrons
- Préparer une glace aux marrons selon la méthode traditionnelle ou utiliser une glace prête à l’emploi.
preparation:
- titre: Préparer la glace au chocolat
  texte:
  - Faire bouillir le lait et la crème.
  - Dans un saladier, mélanger les jaunes d’œufs, le sucre et le cacao, puis fouetter pendant quelques minutes.
  - Verser le lait bouillant sur le mélange en fouettant sans arrêt.
  - Mettre sur feu doux ou au bain-marie, sans faire bouillir, jusqu’à ce que la crème épaississe.
  - Retirer du feu et laisser refroidir en fouettant de temps en temps.
  - Mettre la préparation dans une sorbetière. Lorsque la glace a pris une certaine consistance, la verser dans un moule et laisser au congélateur.
- titre: Préparer le sabayon au rhum
  texte:
  - Chauffer le vin et le rhum dans une casserole (sans faire flamber).
  - Dans un bol, mélanger les jaunes d’œufs et le sucre en fouettant quelques minutes. Verser le vin petit à petit sur les jaunes d’œufs.
  - Remettre sur le feu au bain-marie et fouetter doucement pendant 10 minutes, jusqu’à obtenir un ruban.
  - Ajouter les 2 feuilles de gélatine préalablement trempées dans de l’eau froide.
  - Hors du feu, continuer de fouetter jusqu’à refroidissement. Incorporer délicatement la crème Chantilly.
- titre: Montage et présentation
  texte:
  - Démouler la glace au chocolat sur un plat.
  - Servir avec le sabayon au rhum autour de la glace.
  - Incorporer délicatement des lamelles de poires autour de la glace.
  - Parsemer par-dessus des miettes de palets bretons pour ajouter une touche croquante.
  - Accompagner le tout de glace aux marrons pour compléter ce dessert gourmand.
  - Décorer avec de la crème Chantilly et des palmiers en chocolat pour une finition élégante.
source: Carnet sucré, p. 6-7
