titre: Minicroque-monsieur à la mozzarella
type: salé
categories:
- apéritif
vedettes:
- fromage
ordre: 109
portions: Pour 4 personnes
ingredients:
- 16 très fines tranches de bacon
- 16 très fines rondelles de mozzarella
- 8 rondelles de baguette
- 40 g de beurre
- 8 feuilles de basilic
- Sel, poivre
preparation:
- Préchauffez le four à th. 8 (240°C).
- Faites saisir les tranches de bacon à feu vif et à sec dans une poêle, quelques secondes, pour les colorer.
- Beurrez légèrement les tranches de pain, posez une tranche de bacon, couvrez avec une rondelle de mozzarella, salez, poivrez, et recommencez l’opération.
- Disposez les minicroques-monsieur sur la grille du four et enfournez pour 5 à 7 minutes, juste le temps que le pain soit doré et que la mozzarella soit légèrement dorée.
- Servez chaud, après avoir décoré de feuilles de basilic.
notes:
- titre: Le conseil
  texte:
  - Utilisez de la mozzarella de "buffala", en vente en supermarché, un peu plus chère, mais incomparablement plus parfumée, fine et fondante.
source: Carnet salé, p. 119
