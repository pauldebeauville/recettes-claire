titre: Clafoutis au jambon (ou reblochon)
type: salé
categories:
- plat
vedettes:
- œufs
- fromage
ordre: 55
portions: Pour 4 à 6 personnes
ingredients:
- 1/2 reblochon ou jambon
- 6 cuillères à soupe rases de farine
- 5 œufs
- 500 ml de crème liquide (15 à 30 % de matière grasse)
- 2 cuillères à café de beurre ramolli (25 g)
- Poivre, sel
- 100 g de lardons fumés
preparation:
- Préchauffer le four à 180°C.
- Verser la farine dans un saladier et ajouter les œufs, la crème. Bien mélanger.
- Cuire les lardons et les ajouter à la préparation. Poivrer et saler.
- Beurrer un moule à tarte. Verser le mélange dans le moule et parsemer de petits cubes de reblochon sur la surface.
- Enfourner pendant environ 30 minutes.
- Servir chaud ou tiède.
notes:
- titre: Astuce
  texte:
  - Cette recette s'applique aussi bien avec des légumes.
source: Carnet salé, p. 60
