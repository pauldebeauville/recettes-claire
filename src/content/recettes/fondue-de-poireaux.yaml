titre: Fondue de Poireaux
type: salé
categories:
- accompagnement
vedettes:
- légumes
ordre: 94
portions: Pour 6 personnes
ingredients:
- 800 g de poireaux
- 1 à 2 pommes de terre cuites
- 30 g de beurre
- 100 g de Kasha (sarrasin grillé, en morceaux)
- 1 à 2 oignons émincés
- 1/2 c. à soupe de sel
- Poivre
- 20 cl d'eau
preparation:
- Faire chauffer 20 cl d'eau dans une casserole, incorporer le Kasha et laisser cuire doucement pendant 10 minutes.
- Laver et couper les poireaux.
- Dans une poêle, faire dorer les oignons émincés avec du beurre.
- Cuire les poireaux à couvert dans 30 g de beurre, saler et poivrer pendant 20 minutes.
- Ajouter les pommes de terre cuites, les mixer et ajouter les oignons dorés.
- Mélanger le Kasha aux 2/3 de la fondue de poireaux.
source: Carnet salé, p. 103
