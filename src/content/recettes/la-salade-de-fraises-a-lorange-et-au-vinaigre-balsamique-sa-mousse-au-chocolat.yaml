titre: La Salade de Fraises à l’Orange et au Vinaigre Balsamique, Sa Mousse au Chocolat
type: sucré
categories:
- dessert
vedettes:
- fruits
- chocolat
ordre: 152
portions: Pour 8 personnes
ingredients:
- groupe: La salade de fraises
- 1 kg de fraises
- 100 g de sucre
- 200 g d’orange
- 20 cl de vinaigre balsamique
- groupe: La mousse au chocolat
- 250 g de chocolat de dégustation
- 125 g de crème fraîche
- 5 blancs d’œufs
- 75 g de sucre
- 2 cuillères à café de café dissous dans 1/2 tasse d’eau
preparation:
- section: Préparation de la mousse
- Versez la crème fraîche dans une casserole et portez-la à ébullition.
- Ajoutez le chocolat coupé en petits morceaux et laissez-le fondre tout doucement dans la crème chaude. Mélangez à la spatule et réservez.
- Incorporez ensuite le café (préparé avec 2 cuillères à café de café dissous dans 1/2 tasse d’eau).
- Fouettez les blancs d’œufs avec le sucre jusqu’à obtenir des blancs en neige fermes.
- Mélangez délicatement les blancs montés avec le chocolat fondu. Réservez au réfrigérateur pendant au moins 2 heures.
- section: Préparation du vinaigre
- Versez le vinaigre balsamique dans une petite casserole.
- Faites-le réduire doucement pendant environ 15 minutes, jusqu’à ce qu’il devienne sirupeux.
- section: Préparation de la salade de fraises
- Lavez les fraises, équeutez-les et coupez-les en grosses tranches.
- Pressez les oranges et récupérez le jus.
- Mélangez délicatement les fraises, le jus d’orange et le sucre.
- Déposez les fraises dans des coupes individuelles et laissez-les refroidir au frais.
- section: Dressage
- À l’aide d’une cuillère chaude, formez une belle quenelle de mousse au chocolat.
- Disposez-la délicatement sur chaque salade de fraises.
- Ajoutez au dernier moment un filet de vinaigre balsamique réduit à l’aide d’une cuillère.
- Servez aussitôt pour une dégustation parfaite.
notes:
- titre: Astuce
  texte:
  - Utilisez du chocolat de dégustation pour une mousse encore plus savoureuse.
source: Carnet sucré, p. 39-40
