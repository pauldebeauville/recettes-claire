titre: Tarte aux Framboises et à la Ricotta
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 148
portions: Pour 7 personnes
ingredients:
- 250 g de ricotta
- 250 g de mascarpone
- 250 g de sablés
- 190 g de framboises surgelées (décongelées et égouttées)
- 100 g de sucre
- 90 g de beurre fondu
- 3 œufs
- 1 citron
- Coulis de framboise pour le service
preparation:
- Préchauffez le four à 160°C.
- Beurrez un moule rond de 23 cm de diamètre ou un cercle de 22 cm et tapissez-le de papier sulfurisé (le beurre permettra de faire tenir le papier au fond du moule).
- Réduisez les sablés en poudre à l'aide d'un robot.
- Ajoutez le beurre fondu pour obtenir une pâte que vous étalerez sur le papier sulfurisé. Appuyez avec le dos d'une cuillère pour la tasser.
- Placez-le au frais 30 minutes pour que la pâte durcisse.
- Fouettez la ricotta, la mascarpone, le sucre jusqu’à obtenir un mélange lisse.
- Ajoutez les œufs un par un en mélangeant bien après chaque ajout.
- Ajoutez les zestes de citron.
- Disposez les framboises égouttées sur la pâte et versez délicatement le mélange ricotta / mascarpone.
- Enfournez pendant 40 minutes.
- Laissez tiédir la tarte avant de la démouler et saupoudrez de sucre glace.
- section: Finition et dressage
- Nappez généreusement de coulis de framboise puis mettre des framboises non surgelées comme décoration.
- Servez la tarte tiède ou froide.
source: Carnet sucré, p. 34
