titre: Coulis de Caramel au Beurre Salé
type: sucré
categories:
- base
ordre: 140
ingredients:
- 150 g de sucre
- 150 g de crème liquide
- 75 g de beurre doux
- 1 cuillère à café de fleur de sel
preparation:
- Dans une casserole, chauffez le sucre avec 1 cuillère à soupe d’eau jusqu'à obtenir un caramel doré.
- Quand le caramel atteint une belle couleur ambrée, ajoutez le beurre en morceaux. Mélangez bien pour incorporer.
- Hors du feu, versez progressivement la crème liquide en remuant sans cesse pour éviter les projections.
- Replacez la casserole sur feu doux et ajoutez la fleur de sel. Laissez chauffer jusqu'à obtention d’une consistance lisse.
- Retirez du feu et laissez refroidir.
source: Carnet sucré, p. 23
