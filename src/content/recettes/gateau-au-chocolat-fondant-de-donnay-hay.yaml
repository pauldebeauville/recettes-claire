titre: Gâteau au Chocolat Fondant de Donnay Hay
type: sucré
categories:
- dessert
vedettes:
- chocolat
ordre: 134
portions: Pour 6 personnes
intro:
- Moule à cake 23x12x6 cm
ingredients:
- 200 g de chocolat noir
- 50 g de beurre doux
- 50 g de crème fraîche épaisse
- 80 g de sucre roux
- 3 œufs
- 1 cuillère à soupe de farine
preparation:
- Préchauffez le four à 150°C.
- Faites fondre le chocolat, le beurre en morceaux et le sucre au bain-marie jusqu’à obtenir une texture homogène.
- Incorporez la crème fraîche au mélange chocolat-beurre fondu-sucre.
- Battez les œufs en omelette avec une fourchette, puis ajoutez-les à la préparation. Mélangez bien.
- Ajoutez délicatement la farine tamisée.
- Versez la préparation dans un moule chemisé de papier sulfurisé. Déposez le moule dans un plat rempli d’un bain-marie à mi-hauteur.
- Faites cuire le gâteau au four pendant 1h20 à 150°C pour qu’il garde une texture moelleuse.
- Sortez le moule du bain-marie et laissez refroidir. Entreposez ensuite le gâteau au frais pendant 4h minimum avant de démouler.
source: Carnet sucré, p. 17
