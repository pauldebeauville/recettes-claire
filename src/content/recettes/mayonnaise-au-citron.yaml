titre: Mayonnaise au citron
type: salé
categories:
- sauce
ordre: 110
portions: Pour 2 personnes
ingredients:
- 15 cl d'huile d'olive
- 1 cuillère à café de crème légère d'avoine
- 1 cuillère à café de jus de citron
- 1/2 cuillère à café de sel
- 1 jaune d'œuf
preparation:
- Mélanger le jaune d'œuf et le citron dans un bol.
- Ajouter l'huile d'olive en filet tout en fouettant pour émulsionner.
- Ajouter le sel et la crème d'avoine, puis fouetter à nouveau jusqu'à l'obtention de la consistance souhaitée.
source: Carnet salé, p. 121
