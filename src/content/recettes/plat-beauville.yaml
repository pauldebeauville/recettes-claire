titre: Plat Beauvillé
type: salé
categories:
- plat
vedettes:
- légumes
- fromage
ordre: 39
portions: 2/3 personnes
ingredients:
- 250 g de pâtes fraîches
- 2 courgettes lavées et cuites
- 1 bol de pesto
- 30 feuilles de basilic
- 40 g de pignons grillés
- 40 g de parmesan (ou autre fromage râpé)
- 4 cuil. à soupe d'huile d'olive
- Sel, poivre
- 1 boule de mozzarella
- Lardons émincés cuits
- 1 poignée de tomates cerises cuites
preparation:
- Faites cuire les pâtes fraîches selon les indications du paquet.
- Lavez et faites cuire les courgettes. Réservez.
- Préparez le pesto en mixant le basilic, les pignons, le parmesan, l'huile d'olive, le sel et le poivre.
- Dans un grand plat, mélangez les pâtes avec le pesto, les courgettes cuites, la mozzarella, les lardons émincés cuits et les tomates cerises.
- Décorez avec quelques feuilles de basilic (facultatif).
source: Carnet salé, p. 42
