titre: Salade d’Avocats au Saumon Fumé
type: salé
categories:
- entrée
vedettes:
- saumon
ordre: 28
portions: Pour 2 personnes
ingredients:
- 80 g de chutes de saumon fumé (40 g par personne)
- 2 avocats bien mûrs (1 par personne)
- Feuilles de salade
- Olives pour la décoration
- 1 citron
- 4 œufs de caille
- groupe: Vinaigrette
- 3 c. à soupe d’huile
- 1 c. à soupe de vinaigre
- Sel, poivre
- Herbes fraîches hachées (au choix)
preparation:
- titre: Préparer la base
  texte:
  - Garnissez le fond d’un grand plat ou de deux assiettes avec des feuilles de salade.
- titre: Ajouter les avocats
  texte:
  - Coupez les avocats en lamelles. Disposez-les harmonieusement sur la salade.
  - Aspergez d’un filet de jus de citron pour éviter qu’elles noircissent.
- titre: Cuire les œufs de caille
  texte:
  - Faites cuire les œufs de caille dans de l’eau bouillante pendant 4 minutes.
  - Écalez-les délicatement et coupez-les en deux.
- titre: Préparer la vinaigrette
  texte:
  - Dans un bol, mélangez l’huile, le vinaigre, une pincée de sel, de poivre et les herbes hachées.
- titre: Assembler la salade
  texte:
  - Versez la vinaigrette sur les lamelles d’avocats.
  - Ajoutez les émincés de saumon fumé de façon harmonieuse.
  - Disposez les demi-œufs de caille sur la salade.
  - Décorez avec quelques olives.
- titre: Repos
  texte:
  - Placez la salade au réfrigérateur quelques minutes avant de servir pour la déguster bien fraîche.
source: Carnet salé, p. 28
