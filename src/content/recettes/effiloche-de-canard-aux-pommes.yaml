titre: Effiloché de canard aux pommes
type: salé
categories:
- plat
vedettes:
- volaille
ordre: 44
portions: Pour 4 personnes
ingredients:
- 1 cuisse de canard
- 1 oignon, 1 gousse d'ail
- 1 pomme Elstar (1+1/2 par personne)
preparation:
- Mettre la cuisse de canard avec les fruits au four à 150°C pendant 10 minutes. Dégraisser les morceaux et enlever la peau et la graisse.
- Hacher l'oignon et l'ail, puis les faire blondir dans une poêle.
- Effilocher les cuisses et les ajouter dans la poêle avec l'oignon et l'ail. Ajouter 5 minutes de cuisson avec 1 cuillère de graisse de canard.
- Ajouter le canard, 1 cuillère de graisse de canard et le beurre dans la poêle.
- Dans une autre poêle, cuire les pommes pelées et coupées en tranches.
- À la fin, mettre dans un cercle à quantité égale, le canard puis par-dessus les pommes poêlées. Servir.
source: Carnet salé, p. 48
