titre: Taboulé au crabe
type: salé
categories:
- entrée
vedettes:
- fruits de mer
ordre: 114
portions: Pour 8 personnes
temps:
- label: Préparation
  valeur: 1h12 au réfrigérateur
intro:
- Pas de cuisson
ingredients:
- 250 g de couscous moyen
- 8 radis roses
- 400 g de chair de crabe cuite (en boîte ou surgelée)
- 5 pamplemousses (3 blancs et 2 roses)
- 300 g de crevettes décortiquées
- 2 petites courgettes
- 1 bouquet de fenouil
- 2 citrons
- 1 oignon
- 2 cuil. à soupe d'huile d'olive
- 1 cuil. à soupe de vinaigre
- 1 cuil. à café de Tabasco
- Sel
preparation:
- titre: Préparer le couscous
  texte:
  - Mettez le couscous dans un saladier. Arrosez-le du jus des 3 pamplemousses blancs et des 2 citrons. Couvrez et laissez reposer 12 heures au réfrigérateur.
- titre: Cuire les courgettes
  texte:
  - Coupez les courgettes en rondelles fines. Cuisez-les 2 minutes dans l'eau bouillante salée et égouttez-les.
- titre: Préparer les légumes
  texte:
  - Épluchez les oignons et les fenouils. Coupez-les en tranches très fines. Pelez les pamplemousses et découpez-les en quartiers.
- titre: Assembler le taboulé
  texte:
  - Versez le jus des citrons dans un saladier, ajoutez les courgettes et la moutarde, puis mélangez bien.
- titre: Ajouter les autres ingrédients
  texte:
  - Mélangez le crabe, les crevettes, les radis, et le couscous dans le saladier. Remettez au réfrigérateur.
- titre: Service
  texte:
  - Décorez avec les quartiers de pamplemousse rose et les radis.
notes:
- titre: L'avis du chef
  texte:
  - L'oignon, le fenouil et la courgette peuvent être coupés finement et en un temps record en les passant au robot. Si vous préparez ce taboulé la veille, il sera encore meilleur après 12 heures au réfrigérateur.
source: Carnet salé, p. 125
