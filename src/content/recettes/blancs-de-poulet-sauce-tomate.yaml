titre: Blancs de Poulet Sauce Tomate
type: salé
categories:
- plat
vedettes:
- volaille
ordre: 86
temps:
- label: Temps de préparation
  valeur: '3 min + Thermomix : 15 à 20 min'
ingredients:
- 240 g de tomates fraîches entières ou concassées en boîte
- 4 blancs de poulet
- 1 cube de bouillon de volaille
- 100 g d'oignon coupé en deux
- 10 gousses d'ail
- Herbes (thym, herbes de Provence...)
- Sel, poivre
preparation:
- Mettre les tomates (fraîches ou en boîte), l'ail, et l'oignon dans le Thermomix et mixer 10 secondes à vitesse 5.
- Ajouter les champignons, les blancs de poulet et le cube de bouillon. Ajouter également le sel, le poivre et les herbes. Programmer sur 15 à 20 minutes à 100°C à vitesse 5.
- À la fin de la minuterie, sortir les blancs de poulet et les disposer sur un plat de service chaud. Napper avec la sauce tomate aux champignons.
source: Carnet salé, p. 95
