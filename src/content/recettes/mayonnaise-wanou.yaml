titre: Mayonnaise Wanou
type: salé
categories:
- sauce
ordre: 111
portions: Pour 4 personnes
ingredients:
- 1 jaune d'œuf
- 1 cuil. à soupe de moutarde
- 10 cl d'huile d'olive
- 1/4 cuil. à café de vinaigre
- Herbes (au choix)
preparation:
- Hachez les herbes.
- Versez le jaune d'œuf et la moutarde dans un bol.
- Ajoutez l'huile en filet tout en fouettant pour émulsionner.
- Salez et ajoutez le vinaigre à la fin.
source: Carnet salé, p. 122
