titre: Gratin de pommes de terre, lardons et poireaux
type: salé
categories:
- plat
vedettes:
- légumes
ordre: 75
portions: Pour 6 personnes
ingredients:
- 1 kg de pommes de terre
- 2 c. à soupe d’huile d’olive
- 1 oignon
- 450 g de poireaux coupés en petits morceaux
- 80 g de lardons
- 30 g de beurre mou
- 150 ml de lait tiède
- 1 œuf
- 90 g de fromage râpé
preparation:
- Épluchez les pommes de terre, coupez-les en morceaux, et faites-les cuire dans de l’eau salée pendant 20 minutes, jusqu’à ce qu’elles soient tendres. Égouttez et écrasez-les avec une fourchette.
- Faites chauffer l’huile d’olive dans une poêle. Ajoutez l’oignon ciselé et les poireaux. Faites cuire à feu moyen pendant 10 minutes, en remuant régulièrement. Ajoutez les lardons et poursuivez la cuisson 5 minutes supplémentaires. Réservez.
- Préchauffez le four à 170 °C.
- Dans un bol, incorporez le lait tiède et l’œuf battu aux pommes de terre écrasées. Mélangez bien.
- Ajoutez le beurre mou et la moitié du fromage râpé dans la purée. Mélangez à nouveau. Salez et poivrez.
- Incorporez le mélange de poireaux et de lardons à la préparation de pommes de terre. Mélangez délicatement pour bien répartir les ingrédients.
- Versez la préparation dans un plat à gratin beurré. Saupoudrez avec le reste de fromage râpé.
- Faites cuire au four pendant 35 à 45 minutes, jusqu’à ce que le gratin soit bien doré.
notes:
- titre: Conseil
  texte:
  - Servez ce gratin en accompagnement d’une viande ou comme plat principal avec une salade verte.
source: Carnet salé, p. 82
