titre: Terrine de Maquereaux à la Moutarde et à la Tomate
type: salé
categories:
- entrée
vedettes:
- poisson
ordre: 32
portions: Pour 6 personnes
temps:
- label: Préparation
  valeur: 30 min
intro:
- 'Difficulté : ★★☆☆☆'
- À préparer la veille
ingredients:
- groupe: Pour la terrine
- 1 boîte de maquereaux à la moutarde (176 g)
- 800 g de tomates
- 150 g d’oignons
- 5 cl d’huile d’olive
- 150 g de crème fraîche
- 2 g d’agar-agar en poudre
- 1 branche d’estragon
- Sel, poivre
preparation:
- titre: Préparation de la sauce tomate
  texte:
  - "Épluchez et émincez finement les oignons. Retirez les pédoncules des tomates, plongez-les 20 secondes dans l’eau bouillante, pelez\uFFFEles, épépinez-les et coupez-les en deux."
  - Faites fondre les oignons dans l’huile d’olive 5 minutes à feu doux. Ajoutez la chair des tomates, du sel et du poivre.
  - Mélangez et laissez cuire doucement à découvert jusqu’à obtention d’une sauce épaisse (environ 30 minutes). Réservez.
- titre: Confection de la terrine
  texte:
  - Effeuillez et ciselez l’estragon.
  - Égouttez les maquereaux à la moutarde et écrasez-les légèrement à la fourchette. Mélangez-les avec l’estragon. Réservez.
  - Versez la crème fraîche dans une casserole. Incorporez l’agar-agar et portez à ébullition en remuant. Laissez frémir 5 minutes.
  - Mélangez la crème chaude avec les maquereaux écrasés et la sauce tomate. Bien homogénéiser.
- titre: Repos
  texte:
  - Versez la préparation dans un moule à terrine. Lissez la surface et laissez refroidir à température ambiante.
  - Placez au réfrigérateur pendant au moins 1 heure avant dégustation.
notes:
- titre: Dressage et dégustation
  texte:
  - Démoulez la terrine et coupez-la en tranches avec un couteau à dents.
  - Servez avec une salade d’haricots verts, des poivrons confits à l’huile d’olive ou une salade verte. Les toasts grillés sont également une belle option.
source: Carnet salé, p. 33
