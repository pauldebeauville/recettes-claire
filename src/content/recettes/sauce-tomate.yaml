titre: Sauce Tomate
type: salé
categories:
- sauce
ordre: 89
temps:
- label: Temps de préparation
  valeur: '5 min + Thermomix : 10 min 8 sec'
ingredients:
- 1/2 oignon
- 1 gousse d'ail
- 20 g d'huile d'olive
- 1 c. à soupe de basilic (frais ou surgelé)
- 2 tranches de jambon
- 1 c. à soupe de sel
- 50 g de lardons
- 1 boîte de tomates pelées au jus
- 50 g de crème fraîche
preparation:
- Peler l'oignon et l'ail, puis les mettre dans le bol du Thermomix avec l'huile, le basilic et mixer 5 secondes à vitesse 5. Racler les parois à l'aide de la spatule.
- Ajouter le jambon et hacher 3 secondes à vitesse 4.
- Ajouter les lardons, les tomates pelées et la crème fraîche, puis cuire pendant 10 minutes à 100°C, vitesse 1.
notes:
- texte:
  - Cette sauce peut être utilisée comme base pour des pâtes, des pizzas, ou pour accompagner d'autres plats.
source: Carnet salé, p. 98
