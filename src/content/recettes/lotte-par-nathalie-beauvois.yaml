titre: Lotte par Nathalie Beauvois
type: salé
categories:
- plat
vedettes:
- poisson
ordre: 30
portions: Pour 6 personnes
ingredients:
- 1 queue de lotte (environ 1,2 kg), coupée en 6 morceaux
- 50 g de beurre demi-sel
- 2 échalotes
- 20 cl de crème fraîche
- 1 c. à soupe de moutarde
- 20 cl de vin blanc sec
- Sel, poivre
- 1 poignée d’amandes grillées
preparation:
- titre: Préparer la lotte
  texte:
  - Coupez la lotte en 6 morceaux égaux.
  - Faites fondre le beurre demi-sel dans une poêle à feu moyen.
  - Faites revenir les morceaux de lotte et laissez-les dorer légèrement pendant 1 à 2 minutes de chaque côté.
- titre: Ajouter le vin blanc
  texte:
  - Versez le vin blanc dans la poêle, à mi-hauteur des morceaux de lotte.
  - Ajoutez les échalotes finement hachées.
  - Laissez mijoter à feu doux pendant environ 20 minutes, en retournant les morceaux de temps en temps.
- titre: Ajouter la crème fraîche au dernier moment
  texte:
  - Juste avant de servir, incorporez la crème fraîche et la moutarde directement dans le jus de cuisson. Mélangez bien pour obtenir une sauce onctueuse. Rectifiez l’assaisonnement avec du sel et du poivre.
- titre: Finition avec les amandes
  texte:
  - Saupoudrez les morceaux de lotte avec les amandes grillées pour une touche croquante.
- titre: Service
  texte:
  - Servez la lotte bien chaude, accompagnée de riz ou de légumes vapeur.
source: Carnet salé, p. 31
