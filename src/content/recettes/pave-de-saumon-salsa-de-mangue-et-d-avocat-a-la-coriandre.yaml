titre: Pavé de Saumon Salsa de Mangue et d'Avocat à la Coriandre
type: salé
categories:
- plat
vedettes:
- saumon
- fruits
ordre: 36
portions: Pour 2 personnes
ingredients:
- 2 pavés de saumon sans peau
- 1 mangue
- 1 avocat
- 1 citron vert
- 1 bouquet de coriandre
- 1 cuillère à soupe d'huile d'olive
preparation:
- titre: Préparer la salsa
  texte:
  - Coupez la mangue et l'avocat en petits dés, puis placez-les dans un saladier.
  - Ajoutez le jus d'un citron vert et ciselez la moitié du bouquet de coriandre. Mélangez bien.
  - Salez et versez une cuillère à soupe d'huile d'olive. Réservez.
- titre: Cuire les pavés de saumon
  texte:
  - Faites cuire les pavés de saumon dans une poêle chaude avec un filet d'huile d'olive.
- titre: Assembler et servir
  texte:
  - Déposez une généreuse cuillère de salsa sur chaque pavé de saumon.
  - Décorez avec le reste de coriandre ciselée avant de servir.
notes:
- titre: Notes
  texte:
  - Vous pouvez ajouter une pincée de piment pour relever la salsa si servi entre adultes.
  - Ce plat offre une délicieuse alliance sucrée/salée avec une touche fraîche de coriandre.
source: Carnet salé, p. 39
