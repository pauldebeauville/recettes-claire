titre: Purée de Patate Douce
type: salé
categories:
- accompagnement
vedettes:
- légumes
ordre: 93
versions:
- nom: Version 1
  titre: Purée de Patate Douce
  portions: Pour 2 personnes
  ingredients:
  - 2 patates douces
  - 1 oignon
  - Beurre
  - Sel
  preparation:
  - Éplucher les patates douces et l'oignon.
  - Faire revenir l'oignon à la poêle avec un peu de beurre jusqu'à ce qu'il soit doré.
  - Cuire les patates douces à la vapeur pendant environ 20 minutes.
  - Mixer les patates douces et l'oignon avec un robot jusqu'à obtenir une texture lisse.
  - Ajouter du beurre et du sel au goût.
  source: Carnet salé, p. 102
- nom: Version 2
  titre: Purée de patates douces
  portions: Pour 5 portions
  ingredients:
  - 800 g de patates douces
  - 1 briquette de crème fraîche (20 cl)
  - Huile d'olive
  - 2 cuillères à café de gingembre
  - 1 à 2 gousses d'ail
  - Sel, poivre
  - Zestes d'orange ou de citron pour parfumer
  preparation:
  - "Mettez une grande quantité d'eau à chauffer. Épluchez les patates douces et coupez\uFFFEles en petits morceaux."
  - Faites-les cuire dans l'eau à ébullition pendant environ 10 minutes, jusqu'à ce qu'elles soient tendres.
  - Passez les patates cuites au mixeur avec la crème, l'huile d'olive, l'ail écrasé, le gingembre et les zestes d'orange ou de citron.
  - Assaisonnez avec le sel et le poivre.
  - Mélangez bien et ajustez l'assaisonnement à votre goût.
  source: Carnet salé, p. 130
