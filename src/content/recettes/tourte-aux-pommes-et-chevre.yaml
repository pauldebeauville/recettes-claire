titre: Tourte aux pommes et chèvre
type: salé
categories:
- plat
vedettes:
- fromage
- fruits
ordre: 62
portions: Pour 4 à 6 personnes
ingredients:
- 2 pâtes feuilletées
- Chèvre (un fromage plus fort que le petit Billy)
- Pommes Elstar ou autres (quantité au choix)
- 'Facultatif : pesto et lardons'
preparation:
- Déroulez sur une plaque la première pâte feuilletée.
- Étalez un fromage de chèvre (100 g environ) sur toute la surface.
- Posez deux couches de pommes en lamelles sur le fromage.
- Répartissez des morceaux de beurre fondu sur les pommes.
- titre: Facultatif
  texte:
  - Ajoutez une fine couche de pesto ou des lardons si désiré.
- Recouvrez avec la seconde pâte feuilletée. Faites un trou au centre pour permettre à la vapeur de s’échapper.
- Badigeonnez la pâte avec un œuf battu pour la dorure.
- Faites cuire au four préchauffé à 180 °C pendant environ 20 minutes, jusqu’à ce que la pâte soit bien dorée.
source: Carnet salé, p. 69
