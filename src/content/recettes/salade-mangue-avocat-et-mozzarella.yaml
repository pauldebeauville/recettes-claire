titre: Salade Mangue, Avocat et Mozzarella
type: salé
categories:
- entrée
vedettes:
- fruits
- fromage
ordre: 48
portions: Pour 2 personnes
ingredients:
- 1 mangue (mûre mais pas trop pour pouvoir la trancher)
- 1 avocat
- 1 boule de mozzarella di bufala
- Huile d'olive
- Fleur de sel
- Menthe
- Coriandre
preparation:
- Trancher finement l’avocat et la mangue (que vous avez épluchée). Pour bien les trancher, placez-les côté plat sur la planche à découper.
- Dans l’assiette, alterner des tranches de mangue et d’avocat pour créer une belle rosace.
- Couper la mozzarella en 2 et la placer au milieu de l’assiette.
- Ajouter des herbes fraîches comme la menthe et la coriandre, mais seulement au dernier moment pour éviter qu’elles ne retombent trop vite.
- Ajouter un filet d'huile d'olive, de la fleur de sel et du poivre.
- Servir avec une tranche de pain grillé de seigle ou de levain.
source: Carnet salé, p. 52-53
