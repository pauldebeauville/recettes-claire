titre: Tarte à la Ricotta, au Citron et aux Amandes
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 143
portions: Pour 8 personnes
ingredients:
- 120 g de beurre mou
- 270 g de sucre en poudre
- Le zeste d’un citron
- 4 œufs
- 240 g de poudre d’amandes (assez fine)
- 300 g de ricotta
- 60 g d’amandes effilées
- Sucre glace (pour la décoration)
preparation:
- Préchauffez votre four à 160°C.
- Séparez les blancs des jaunes d’œufs.
- Dans un saladier ou robot, déposez le beurre mou, 165 g de sucre et les zestes de citron. Mélangez pendant 8 à 10 minutes pour obtenir une texture crémeuse.
- Incorporez les jaunes d’œufs un par un et ajoutez progressivement la poudre d’amandes, puis la ricotta. Mélangez bien.
- titre: Montez les blancs en neige
  texte:
  - Quand ils commencent à mousser, ajoutez progressivement le sucre en poudre en continuant de battre jusqu’à obtenir une texture ferme.
- Incorporez délicatement les blancs en neige à la préparation en soulevant doucement à l’aide d’une spatule.
- Versez dans un moule souple ou chemisé de papier sulfurisé.
- Saupoudrez la surface de la tarte avec les amandes effilées.
- titre: Cuisson
  texte:
  - Enfournez pendant 45 minutes à 160°C.
- Laissez complètement refroidir avant de démouler.
- Saupoudrez de sucre glace avant de servir.
notes:
- texte:
  - Dégustez cette tarte délicatement parfumée au citron pour un dessert frais et raffiné.
source: Carnet sucré, p. 26
