titre: Burrata et soupe de patate douce à la sauge
type: salé
categories:
- soupe
- entrée
vedettes:
- légumes
- fromage
ordre: 67
portions: Pour 4 personnes
ingredients:
- 1 kg de patate douce
- 1 c. à soupe d’huile d’olive
- 1 oignon ou 2 échalotes
- 1/2 litre (maximum) de bouillon de légumes
- 50 g de crème fraîche liquide (15 % MG)
- 6 feuilles de sauge (et quelques supplémentaires pour la décoration si souhaité)
- 4 petites burratas ou burratinas
- 30 g de noix
- 1 c. à soupe d’huile d’olive (pour la finition)
- Fleur de sel et poivre
preparation:
- Épluchez les patates douces et coupez-les en gros morceaux.
- Dans une grande casserole ou une cocotte, faites chauffer l’huile d’olive à feu moyen.
- Faites revenir l’oignon ou les échalotes émincés, les feuilles de sauge, et les morceaux de patate douce. Salez légèrement et poivrez. Mélangez bien.
- Laissez cuire à feu vif pendant 3 à 4 minutes, en remuant régulièrement.
- Ajoutez le bouillon de légumes (dosez selon la consistance souhaitée). Réduisez le feu et laissez cuire à couvert à feu doux pendant environ 30 minutes, jusqu’à ce que les morceaux soient bien tendres.
- Mixez la soupe jusqu’à obtenir une texture lisse et homogène. Ajoutez la crème fraîche et mélangez bien.
- Servez la soupe chaude dans des bols ou des assiettes creuses. Disposez une petite burrata au centre de chaque bol.
- Ajoutez quelques morceaux de noix, un filet d’huile d’olive, et une pincée de fleur de sel pour la finition.
notes:
- titre: Conseil
  texte:
  - Cette soupe peut être servie comme plat complet grâce à la burrata, ou accompagnée de pain grillé pour plus de gourmandise.
source: Carnet salé, p. 74
