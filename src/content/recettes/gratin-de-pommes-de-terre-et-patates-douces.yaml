titre: Gratin de Pommes de Terre et Patates Douces
type: salé
categories:
- accompagnement
vedettes:
- légumes
ordre: 96
portions: Pour 4 personnes
ingredients:
- 4 petites patates douces
- 1 kg de pommes de terre
- 2 gousses d'ail ciselées (réparties entre les lamelles de pommes de terre)
- Romarin en branche
- Huile d'olive
preparation:
- Préchauffer le four à 170°C (ou 175°C).
- Laver les pommes de terre et les sécher. Couper les pommes de terre et les patates douces en tranches fines, à l'aide d'une mandoline si vous en avez une.
- Huiler le fond du plat à gratin avec un pinceau et un essuie-tout.
- Disposer les pommes de terre en rosace, en mettant les patates douces au centre (ou en intercalant les deux si vous aimez).
- Répartir les 2 gousses d'ail ciselées entre les lamelles de pommes de terre, ajouter un filet d'huile d'olive, de la fleur de sel, du poivre, du romarin en branche.
- Faire cuire pendant 1 heure.
notes:
- texte:
  - Vous pouvez le préparer la veille.
source: Carnet salé, p. 105
