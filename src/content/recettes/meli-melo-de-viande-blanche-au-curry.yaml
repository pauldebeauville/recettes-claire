titre: Méli-mélo de viande blanche au curry
type: salé
categories:
- plat
vedettes:
- viande
ordre: 43
portions: Pour 4 personnes
ingredients:
- 2 échalotes
- 1 gousse d'ail
- 1 pomme granny
- 2,5 dl de fumet de volaille (eau + cube de bouillon)
- 1 dl de vin blanc sec
- 30 g de beurre
- 3 dl de crème fraîche liquide
- 1 cuillère à soupe de curry
preparation:
- Hacher les échalotes et couper la pomme en petits dés.
- Faire revenir le tout au beurre sans colorer. Ajouter la gousse d'ail écrasée.
- Ajouter le vin blanc et le fumet de volaille.
- Faire réduire de moitié.
- Ajouter la crème fraîche liquide et le curry. Bien fouetter et laisser réduire quelques minutes jusqu'à consistance onctueuse.
- Choisir différents morceaux de volaille (poulet, dinde, etc.).
- Cuire la volaille au four, puis la couper en morceaux.
- Réchauffer la sauce et ajouter la volaille cuite.
- Servir avec de la ciboulette pour décorer.
notes:
- texte:
  - Accompagnez de légumes ou de riz basmati pour compléter le plat.
source: Carnet salé, p. 47
