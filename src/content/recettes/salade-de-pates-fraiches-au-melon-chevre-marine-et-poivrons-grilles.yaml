titre: Salade de pâtes fraîches au melon, chèvre mariné et poivrons grillés
type: salé
categories:
- plat
vedettes:
- fromage
- fruits
ordre: 77
portions: Pour 4 personnes
ingredients:
- 4 poignées de pâtes fraîches (300 g environ)
- 1 bûche de chèvre frais (marinée dans un peu d’huile d’olive)
- 1 melon de taille moyenne + 1/2 melon
- 1 poivron grillé (pelé et coupé en lanières)
- 2 c. à soupe d’huile d’olive (pour la vinaigrette)
- Sel
- 'Facultatif : Quelques morceaux de tzatziki'
- 'Facultatif : Des morceaux de poulet déjà cuits de chez Picard'
preparation:
- Faites cuire les pâtes dans de l’eau salée selon les instructions du paquet. Égouttez-les, laissez-les refroidir légèrement et mélangez-les avec 2 c. à soupe d’huile d’olive et une pincée de sel. Réservez.
- titre: Préparez le chèvre
  texte:
  - Coupez la bûche de chèvre en rondelles ou en morceaux. Faites-les mariner dans un peu d’huile d’olive pendant au moins 10 minutes.
- titre: Préparez le melon
  texte:
  - Coupez le melon en deux, retirez les graines et formez des billes à l’aide d’une cuillère parisienne (ou coupez-le en cubes).
- titre: Assemblez la salade
  texte:
  - Dans un grand saladier, mélangez les pâtes, les billes de melon, les poivrons grillés, et les morceaux de chèvre mariné. Ajoutez, si vous le souhaitez, des morceaux de tzatziki et/ou des morceaux de poulet déjà cuits.
- Mélangez délicatement pour ne pas écraser les ingrédients.
- Servez frais, avec un filet supplémentaire d’huile d’olive si nécessaire.
source: Carnet salé, p. 84
