titre: Poires à la Vigneronne
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 142
ingredients:
- 4 grosses poires
- 175 g de sucre
- 4 cuillères à soupe de sirop de framboises
- 8 petits suisses
- 2 cuillères à soupe de crème fraîche
- 100 g de noix décortiquées
- 4 grappes de raisin
preparation:
- Pelez les poires en conservant leur tige.
- Faites-les pocher dans une casserole d’eau bouillante avec le sucre pendant 15 à 20 minutes, jusqu’à ce qu’elles soient tendres.
- Égouttez-les et laissez refroidir.
- Mélangez les petits suisses avec la crème fraîche pour obtenir une texture lisse.
- Ajoutez les noix concassées à la préparation.
- Disposez chaque poire dans une assiette, nappez de sirop de framboises.
- Accompagnez chaque poire de la préparation aux petits suisses et décorez avec une grappe de raisin.
source: Carnet sucré, p. 25
