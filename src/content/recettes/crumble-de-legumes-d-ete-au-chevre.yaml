titre: Crumble de Légumes d'Été au Chèvre
type: salé
categories:
- plat
- accompagnement
vedettes:
- légumes
- fromage
ordre: 85
portions: Pour 4 personnes
ingredients:
- groupe: Pour le crumble
- 80 g de parmesan râpé
- 80 g de flocons d'avoine
- 80 g de beurre froid + 1/2 sel
- 80 g de farine de blé ou d’épeautre
- groupe: Pour les légumes
- 300 g de tomates cocktail
- 2 courgettes
- 1 aubergine
- 1 chèvre frais, ou de la féta (ou rien)
- 4 branches de basilic
- 15 olives
- Huile d'olive
preparation:
- Préchauffer le four à 180°C.
- Dans un plat à gratin, mettre les tomates coupées, les courgettes et l'aubergine en petits morceaux. Ajouter 2 cuillères à soupe d'huile d'olive et du sel. Ajouter le basilic. Cuire au four pendant 30 minutes pour que les légumes soient tendres.
- Ajouter 1 chèvre frais émietté, ou de la féta, ou ne rien ajouter selon votre préférence.
- Dans un saladier, mélanger le beurre, la farine, le parmesan et les flocons d'avoine pour obtenir une pâte sablée. Ajouter les olives hachées et le basilic. Recouvrir le plat de légumes avec ce crumble.
- Cuire au four pendant 25-30 minutes jusqu'à ce que le crumble soit doré.
source: Carnet salé, p. 94
