titre: Caviar d'aubergines au chèvre et cumin
type: salé
categories:
- apéritif
- sauce
vedettes:
- légumes
ordre: 106
ingredients:
- 1 aubergine
- 110 g de chèvre frais
- 1 cuillère à soupe d'ail surgelé
- Zeste et jus de 1/2 citron bio
- 1 cuillère à café de cumin en graines, bombée
- 1 cuillère à soupe d'huile d'olive
- 1/2 cuillère à café de sel fin
preparation:
- Coupez l'aubergine en 2 dans le sens de la longueur.
- Entaillez la chair et cuisez-la à la vapeur ou 15 minutes au four.
- Récupérez la chair et placez-la dans un mixeur.
- Ajoutez le chèvre, l'ail, le zeste et le jus de citron, le cumin, l'huile d'olive et le sel.
- Mixez jusqu'à obtenir une texture lisse et homogène.
source: Carnet salé, p. 116
