titre: Terrine de Poulet
type: salé
categories:
- entrée
vedettes:
- volaille
ordre: 54
portions: Pour 4 personnes
ingredients:
- 500 g de blanc de poulet ou filet de dinde
- 2 oignons jaunes hachés
- 6 cornichons hachés
- 3 petits suisses à 40%
- 2 cuil. à soupe de crème fraîche 15%
- 2 cuil. à soupe d’estragon Picard
- 1 pincée de noix de muscade
- Sel
preparation:
- Dans une poêle, faire cuire et dorer le poulet à feu doux, environ 7 minutes.
- Transférer la viande dans une jatte, ajoutez tous les autres ingrédients. Mélanger pendant 15 secondes pour obtenir une pâte homogène.
- Verser cette pâte dans une terrine. Recouvrir d’un film alimentaire et mariner 2 heures au minimum au réfrigérateur avant de servir.
source: Carnet salé, p. 59
