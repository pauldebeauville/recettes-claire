titre: Fondant Tiède à l’Orange, Sa Salade d’Oranges au Thé
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 146
portions: Pour 6 personnes
ingredients:
- groupe: Pour le gâteau
- 150 g + 10 g de beurre ramolli (pour le moule)
- 150 g de sucre
- 2 œufs
- 1/2 sachet de levure
- 1 orange (non traitée)
- 115g + 10 g de farine (pour le moule)
- groupe: Pour la salade d’oranges
- 6 oranges
- 1 cuillère à soupe de sucre
- 1 cuillère à café de thé
- groupe: Pour le sirop pour imbiber le gateau
- 1 orange
- 110g de sucre glace
preparation:
- section: Préparation du gâteau
- Préchauffez le four à 180°C.
- Prélevez le zeste de l’orange et pressez son jus. Réservez.
- Dans un saladier, mélangez le beurre ramolli, le sucre, l'orange les oeufs un par un, la farine, la levure, le zeste, le tout au fouet en respectant cet ordre.
- Mélangez délicatement.
- Versez la préparation dans un moule beurré et fariné.
- Enfournez pendant 30 minutes.
- 'Pendant ce temps-là, préparer le sirop pour imbiber le gâteau : mélanger le jus d''orange et le sucre glace.'
- section: Préparation de la salade d’oranges au thé
- Pelez les oranges à vif et découpez-les en rondelles. (retirer la peau épaisse et la peau blanche)
- Séparer les quartiers d'orange avec un petit couteau bien aiguisé au-dessus du saladier.
- Récupérez tout le jus des oranges obtenu dans le saladier.
- Verser le jus dans une casserole, faites chauffer avec le sucre, le monter à ébullition.
- Retirez du feu et incorporez le thé. Laissez infuser 7 minutes. Versez ce sirop sur les rondelles d’oranges.
- Filmez le saladier avec les quartiers et le jus au thé. Laissez au frais 1 heure.
- section: Finition et dressage
- Démoulez le fondant à l'orange en fin de cuisson dans un plat et imbiber doucement avec une petite louche de sirop. Laissez reposer au moins 15 minutes.
- Disposez chaque part tiède dans une assiette.
- Ajoutez quelques rondelles d’oranges imbibées de sirop.
- Nappez légèrement de sirop pour encore plus de gourmandise.
notes:
- texte:
  - Servez ce fondant tiède avec la salade d’oranges bien fraîche pour un dessert plein de saveurs.
source: Carnet sucré, p. 30-31
