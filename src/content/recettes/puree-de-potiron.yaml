titre: Purée de potiron
type: salé
categories:
- accompagnement
vedettes:
- légumes
ordre: 117
portions: Pour 4 personnes
ingredients:
- 800 g à 1 kg de potiron
- 2 gros oignons
- Huile d'olive
- Ail (un peu)
- Herbes (au choix)
- 20 g de beurre
- 1 citron
preparation:
- Coupez le potiron en dés.
- Faites dorer les oignons dans une poêle avec un peu d'huile d'olive ou dans une cocotte.
- Ajoutez le potiron, faites-le revenir, puis couvrez et laissez cuire jusqu'à ce que le potiron soit tendre (environ 30 minutes à feu doux).
- Ajoutez l'ail et les herbes selon vos goûts, puis mixez le tout pour obtenir une purée lisse.
- Ajoutez le beurre et le jus de citron à la purée, puis mélangez bien.
- Servez chaud, accompagné d'un peu de persil ou d'autres herbes fraîches selon vos préférences.
source: Carnet salé, p. 128
