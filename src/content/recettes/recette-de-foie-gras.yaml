titre: Recette de foie gras
type: salé
categories:
- entrée
vedettes:
- volaille
ordre: 47
portions: Un foie de 750 g environ pour 12 personnes
ingredients:
- 750 g de foie de canard cru
- 3 cuillères à soupe de cognac
- 3 cuillères à soupe de porto
- Sel fin (environ 15 g par kg de foie)
- Poivre
preparation:
- titre: Dénervage du foie
  texte:
  - Se procurer un très bon foie cru de canard. Attendre que le foie soit bien à température ambiante pour mieux le travailler.
  - Rechercher les veines dans chaque lobe.
  - Le petit lobe a un seul niveau de veines, que l’on enlève avec les doigts (sans couteau), puis tirer doucement le foie.
  - Le gros lobe contient deux niveaux de veines superposées qu’il faut aussi retirer.
  - Tous les petits restes veineux disparaîtront à la cuisson.
- titre: Marinade
  texte:
  - Dans un plat, mettez du sel fin (15 g par kg de foie). Ajouter le cognac et le porto.
  - Retourner plusieurs fois les lobes dans cette préparation pour bien les imbiber.
  - Tasser les lobes dans une terrine en porcelaine, en veillant à ce que les parties lisses soient contre les parois et les morceaux déchirés au centre.
  - Verser le reste de la marinade par-dessus.
- titre: Cuisson
  texte:
  - Placer la terrine dans un bain-marie bouillant et cuire pendant 8 minutes (ou 9 minutes pour moins de rosé).
  - Après cuisson, tasser le foie avec une planchette de la taille de la terrine et placer un poids pour faire remonter la graisse.
  - Lorsque la terrine est refroidie, retirer la planchette et faire glisser la graisse.
  - Laisser reposer au réfrigérateur au moins trois jours avant dégustation.
source: Carnet salé, p. 51
