titre: Tarte fine aux courgettes, chèvre, pignons et menthe fraîche
type: salé
categories:
- plat
vedettes:
- légumes
- fromage
ordre: 74
portions: Pour 6 personnes
ingredients:
- 1 rouleau de pâte feuilletée
- 3 courgettes
- 2 c. à soupe de Philadelphia
- 1 paquet de chèvre frais (ou 1/2 Petit Billy)
- 30 g de pignons de pin
- 2 c. à soupe d’huile d’olive
- Feuilles de menthe fraîche (ciselées)
- 2 c. à soupe de pesto
- Tomates cerises (facultatif)
preparation:
- Préchauffez le four à 180 °C.
- Déroulez la pâte feuilletée et formez un rectangle. Placez-la sur une plaque recouverte de papier cuisson.
- Étalez une fine couche de Philadelphia sur toute la surface de la pâte.
- Lavez et essuyez les courgettes, puis coupez-les finement en tranches. Si vous utilisez des tomates cerises, coupez-les en deux.
- Disposez les tranches de courgettes (et éventuellement les tomates cerises) en rosace sur la pâte. Veillez à ce qu'elles se chevauchent légèrement pour une cuisson homogène.
- Faites dorer les pignons de pin dans une poêle à sec jusqu’à ce qu’ils soient légèrement colorés. Réservez.
- Enfournez la tarte pendant 20 à 25 minutes, jusqu’à ce que la pâte soit bien dorée et que les courgettes soient légèrement colorées.
- section: Finition
- Lorsque la tarte est cuite, émiettez le chèvre frais (ou 1/2 Petit Billy) sur le dessus en retirant la croûte.
- Répartissez les pignons dorés et les feuilles de menthe fraîche ciselées sur la tarte.
- Ajoutez quelques touches de pesto sur les morceaux de chèvre pour rehausser les saveurs.
notes:
- titre: Option préparation à l’avance
  texte:
  - Vous pouvez cuire la pâte feuilletée et les courgettes séparément à l’avance. Assemblez la tarte avec les courgettes et le fromage juste avant de réchauffer et servir.
- titre: Conseil
  texte:
  - Servez cette tarte fine avec une salade verte pour un repas léger et équilibré.
source: Carnet salé, p. 81
