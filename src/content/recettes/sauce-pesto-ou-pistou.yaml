titre: Sauce Pesto (ou Pistou)
type: salé
categories:
- sauce
ordre: 90
temps:
- label: Temps de préparation
  valeur: '10 min + Thermomix : 15 min 25 sec'
ingredients:
- 50 g de parmesan
- 30 g de pignons de pin
- 1 gousse d'ail
- 80 g de basilic frais
- 10 g d'huile d'olive extra vierge
- 1 pincée de sel
preparation:
- Mettre dans le bol du Thermomix le parmesan, les pignons de pin et l'ail, puis mixer 20 secondes à vitesse 7.
- Ajouter les feuilles de basilic lavées et essuyées, l'huile d'olive et le sel, puis mixer encore 20 secondes à vitesse 7.
- Si la consistance est trop liquide, vous pouvez ajuster avec un peu plus de parmesan ou de pignons de pin selon votre préférence.
notes:
- texte:
  - Cette sauce peut être utilisée pour accompagner des pâtes
source: Carnet salé, p. 99
