titre: Salade pois chiches, avocat et patate douce
type: salé
categories:
- entrée
vedettes:
- légumes
ordre: 73
portions: Pour 4 personnes
ingredients:
- 1 boîte de pois chiches (400 g)
- 1 grosse patate douce
- 2 avocats
- 4 c. à soupe d’huile d’olive
- 1 c. à soupe de vinaigre balsamique ou de citron
- 1/2 c. à café de cumin en poudre ou en graines (ou remplacez par 1/2 c. à café de romarin haché finement)
- 1 gousse d’ail (hachée finement)
- Quelques petites tomates cerises (optionnel)
preparation:
- Lavez et épluchez la patate douce. Coupez-la en cubes et faites-la cuire à la vapeur ou à l’eau jusqu’à ce qu’elle soit tendre. Égouttez et laissez refroidir.
- Égouttez et rincez les pois chiches.
- Coupez les avocats en morceaux.
- Dans un saladier, mélangez les cubes de patate douce refroidis, les pois chiches, les morceaux d’avocat et, si désiré, les tomates cerises coupées en deux.
- Préparez une vinaigrette en mélangeant l’huile d’olive, le vinaigre balsamique ou le jus de citron, le cumin (ou le romarin), et l’ail haché.
- Versez la vinaigrette sur la salade, mélangez délicatement et servez immédiatement.
notes:
- titre: Conseil
  texte:
  - Choisissez entre cumin et romarin en fonction de vos préférences pour varier les saveurs de cette salade.
source: Carnet salé, p. 80
