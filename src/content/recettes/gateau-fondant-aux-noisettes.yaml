titre: Gâteau fondant aux noisettes
type: sucré
categories:
- dessert
ordre: 124
portions: Pour 6 personnes
ingredients:
- 'Sucre roux : 170 g + 1 cuillère à café pour le moule'
- 'Œufs : 3'
- 'Huile de chanvre : 25 g'
- 'Poudre de noisette : 170 g'
- 'Levure : 1 pincée'
- 'Sel : 1 pincée'
- 'Beurre : 1 noisette pour le moule'
preparation:
- Préchauffer le four à 170°C.
- Fouetter vivement les œufs, le sucre et l’huile dans un robot électrique jusqu’à obtention d’un ruban blanchi.
- À l’aide d’une spatule, ajouter délicatement la poudre de noisette, la levure et le sel. Mélanger jusqu’à obtenir une pâte homogène.
- Beurrer un moule, saupoudrer de sucre, puis y verser la pâte.
- Cuire le gâteau au four à 170°C pendant 30 minutes.
- Laisser légèrement refroidir, démouler et recouvrir légèrement de sucre glace avant dégustation.
source: Carnet sucré, p. 4
