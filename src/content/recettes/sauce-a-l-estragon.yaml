titre: Sauce à l'estragon
type: salé
categories:
- sauce
ordre: 112
intro:
- Pour poisson, viande blanche, ou légumes
ingredients:
- Crème fraîche (200 ml) ou crème végétale
- Estragon
- Sel
preparation:
- Chauffez la crème sans faire bouillir.
- Ajoutez l'estragon, puis le sel.
- Mélangez bien et servez avec vos plats.
source: Carnet salé, p. 123
