titre: Délice Bûche Rose à la pâte d’amande
type: sucré
categories:
- dessert
ordre: 123
portions: Pour 8 à 10 personnes
ingredients:
- 'Biscuits de Reims roses : 24'
- 'Beurre mou : 200 g'
- 'Sucre en poudre : 200 g'
- 'Œuf entier : 1'
- 'Grand Marnier : 2 cuillères à soupe'
preparation:
- Écraser ou mixer les biscuits roses de Reims.
- Ajouter le beurre mou, le sucre, l’œuf entier et le Grand Marnier. Bien mélanger jusqu’à obtenir une pâte homogène.
- Façonner cette préparation en forme de bûche.
- Recouvrir la bûche de pâte d’amande.
- Décorer selon vos envies avec du cacao ou des fruits confits pour une finition gourmande.
source: Carnet sucré, p. 3
