titre: Sauté de porc aux champignons et pommes de terre
type: salé
categories:
- plat
vedettes:
- viande
ordre: 108
portions: Pour 4 personnes
ingredients:
- 800 g de porc
- 2 gros oignons
- 20 g de beurre
- 1 feuille de laurier
- 1 branche de thym
- Persil
- Sel, poivre
- 50 cl de vin blanc
- 3 carottes
- Quelques petites pommes de terre
- 1 boîte de champignons de Paris
- 2 cuil. à soupe de moutarde forte
- 3 cuil. à soupe de crème fraîche
- 2 cuil. à soupe de farine
preparation:
- Faire revenir dans une cocotte le beurre avec les oignons émincés et le porc coupé en morceaux.
- Ajouter le vin blanc, le persil, le laurier, le thym, les carottes coupées en rondelles et les pommes de terre entières. Assaisonner selon votre convenance.
- Couvrir et laisser mijoter pendant 1 heure sur feu moyen.
- Ajouter la crème fraîche, la moutarde, les champignons, la farine et bien mélanger.
- Laisser de nouveau cuire pendant 30 minutes environ.
- Servir avec un accompagnement.
source: Carnet salé, p. 118
