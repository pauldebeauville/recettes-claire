titre: Dessert de Madame Guérard
type: sucré
categories:
- dessert
vedettes:
- chocolat
ordre: 149
portions: Pour 6 à 8 personnes
ingredients:
- 280 g de chocolat
- 280 g de beurre fin
- 280 g de sucre semoule
- 9 jaunes d'œufs
- 5 blancs d'œufs
- 1 pincée de sel
- 2 zestes d’oranges
preparation:
- Préchauffez le four à 150°C.
- Faites fondre le chocolat au bain-marie, puis ajoutez le beurre en morceaux. Mélangez bien et réservez pour laisser refroidir légèrement.
- Dans un saladier, mélangez les jaunes d'œufs et le sucre. Fouettez ce mélange jusqu’à ce qu’il blanchisse.
- Incorporez délicatement le mélange jaunes-sucre au chocolat fondu. (Ne pas battre trop longtemps sinon la crème diminue).
- Battez les blancs en neige avec une pincée de sel. Versez le chocolat sur les blancs, puis mélangez délicatement.
- titre: Cuisson
  texte:
  - "Beurrez un moule rond et versez-y la moitié de la crème. Cuisez au bain\uFFFEmarie dans un four préchauffé thermostat 6-7 pendant 45 minutes (ou cuire au four directement pas longtemps). Laissez refroidir complètement."
- Pendant ce temps, ajoutez les zestes des 2 oranges à la mousse restante et placez-la au réfrigérateur pour la raffermir.
- Une fois le gâteau cuit et quand il est encore chaud, démoulez-le délicatement, et laissez refroidir.
- Posez un cercle métallique de même diamètre que le gâteau et versez la mousse au chocolat dessus pour obtenir une seconde couche.
- Placez au réfrigérateur pour que la mousse prenne bien.
source: Carnet sucré, p. 35
