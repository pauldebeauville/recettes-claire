titre: Bouchées à la Reine à la Nantua
type: salé
categories:
- entrée
vedettes:
- fruits de mer
ordre: 35
portions: Pour 6 personnes
ingredients:
- 6 feuilletages de bouchées à la reine (ou une tourte en pâte feuilletée)
- '24 écrevisses fraîches (ou du poisson : cabillaud, saumon, merlu)'
- 300 g de ris de veau
- 3 quenelles de brochet
- 10 cl de crème épaisse
- 50 g de beurre
- 2 c. à soupe d'huile
- 2 c. à soupe de vinaigre
- Sel, poivre
preparation:
- titre: Préparer les écrevisses ou le poisson
  texte:
  - Laissez tremper le ris de veau dans de l’eau froide vinaigrée.
  - 'Si vous utilisez des écrevisses : détachez la tête, retirez le boyau noir en tirant sur la nageoire caudale centrale. Faites sauter les queues d’écrevisses à feu vif dans une sauteuse avec l’huile pendant 8 minutes. Laissez tiédir, puis décortiquez-les.'
  - 'Si vous utilisez du poisson : coupez-le en morceaux et faites-le revenir à feu moyen avec une cuillère d’huile jusqu’à ce qu’il soit cuit. Réservez.'
- titre: Cuire les quenelles
  texte:
  - Faites pocher les quenelles dans de l’eau frémissante pendant 5 minutes, égouttez-les, et coupez-les en dés. Réservez.
- titre: Préparer le ris de veau
  texte:
  - Égouttez le ris de veau, retirez la peau, les nerfs et épongez-le.
  - Détaillez-le en dés et faites-le revenir pendant 3 minutes dans une poêle avec 25 g de beurre. Salez, poivrez et réservez.
- titre: Assembler et chauffer la garniture
  texte:
  - Dans une sauteuse, faites chauffer la sauce crustacés et la crème. Ajoutez les écrevisses ou le poisson, le ris de veau et les quenelles. Réchauffez le tout à feu doux pendant 2 minutes en remuant doucement.
- titre: Finalisation et dressage
  texte:
  - 'Si vous utilisez des bouchées feuilletées : garnissez-les avec la garniture chaude, remettez les chapeaux et servez immédiatement.'
  - 'Si vous optez pour une tourte : versez la garniture dans la pâte feuilletée précuite, refermez avec un couvercle de pâte et faites cuire au four à 180°C pendant 10 à 15 minutes, jusqu’à ce que la pâte soit dorée.'
notes:
- titre: Remarques et variantes
  texte:
  - Les queues d'écrevisses peuvent être remplacées par du poisson comme le cabillaud, le saumon ou le merlu.
  - 'Une alternative pratique : utilisez la sauce Picard aux crustacés ou au Noilly Prat.'
source: Carnet salé, p. 37
