titre: Salade du Sud-Ouest
type: salé
categories:
- entrée
vedettes:
- volaille
ordre: 88
portions: Pour 4 personnes
temps:
- label: Préparation
  valeur: '10 min | Cuisson : 40 min'
ingredients:
- 800 g de pommes de terre à salade type Charlotte
- 200 g de magrets de canard fumé
- 150 g de gésiers confits
- 100 g de champignons (Paris, girolles…)
- 1 échalote
- 30 g de beurre
- 3 cuillères à soupe de vinaigre balsamique
- 6 cuillères à soupe d'huile d'olive
- Sel, poivre
preparation:
- Mettez les pommes de terre à cuire dans l'eau bouillante salée pendant 30 min. Égouttez-les, épluchez-les et coupez les plus grosses en deux dans la longueur.
- Pelez et émincez l'échalote. Otez le bout terreux des champignons. Passez-les rapidement sous l'eau froide et émincez-les.
- Mettez à chauffer le beurre dans une poêle et faites-y revenir l'échalote 2 min sur feu doux. Ajoutez les champignons et poursuivez la cuisson 5 min. Salez-les et poivrez-les.
- Mélangez dans un bol le vinaigre avec le sel et le poivre. Versez l'huile en fouettant.
- Dans un saladier, mélangez les pommes de terre, les magrets de canard, les champignons et les gésiers confits. Versez la sauce, remuez et servez.
source: Carnet salé, p. 97
