titre: Légumes rôtis à la burrata
type: salé
categories:
- plat
- accompagnement
vedettes:
- légumes
- fromage
ordre: 71
portions: Pour 4 personnes
ingredients:
- 3 à 4 aubergines (selon la taille)
- 3 petites courgettes
- 1 poivron jaune
- 4 tomates coupées en deux (optionnel, car elles rejettent de l’eau, ou à éviter si vous préférez une texture plus sèche)
- 1 c. à soupe de thym
- 1 c. à soupe d'herbes de Provence
- 20 g de pignons de pin
- Huile d’olive
- Crème de balsamique
- 2 burratas ou 2 mozzarellas
- Sel, poivre
preparation:
- Préchauffez le four à 180 °C.
- Lavez les légumes et passez-les sous un filet d’eau froide.
- Coupez les aubergines et les courgettes dans le sens de la longueur. Retirez les graines et la peau du poivron jaune, puis coupez-le en 4. Si vous utilisez des tomates, coupez-les en deux, mais utilisez-en peu ou omettez-les pour éviter qu'elles ne rendent trop d’eau.
- Disposez les légumes dans un plat allant au four, face coupée vers le haut. Arrosez-les d’un filet d’huile d’olive, saupoudrez de gros sel, de thym, et d'herbes de Provence.
- Faites cuire les légumes au four pendant 35 à 40 minutes, jusqu’à ce qu’ils soient tendres et légèrement dorés.
- Pendant ce temps, faites griller les pignons de pin à sec dans une poêle.
- Coupez les burratas ou mozzarellas en morceaux et disposez-les sur les légumes encore tièdes.
- Ajoutez les pignons grillés, un filet de crème de balsamique, et un peu d’huile d’olive pour sublimer le plat.
notes:
- titre: Conseil
  texte:
  - Servez avec une salade verte ou un peu de pain grillé pour un repas équilibré et gourmand.
source: Carnet salé, p. 78
