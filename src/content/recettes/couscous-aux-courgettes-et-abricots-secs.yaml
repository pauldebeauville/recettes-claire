titre: Couscous aux courgettes et abricots secs
type: salé
categories:
- plat
vedettes:
- viande
ordre: 57
portions: Pour 3 personnes
ingredients:
- 350 g de filet de mouton en morceaux (épaule de mouton)
- 85 g de semoule de couscous (moyenne)
- 2 courgettes vertes
- 20 g d'abricots secs
- 30 g d'amandes
- 30 g de raisins
- 500 ml de bouillon de volaille chaud
- 2 cuil. à café de raz el hanout (mélange d'épices orientales ou épices à tajine)
- 1 cuil. à soupe d'huile d'olive
preparation:
- Dans une grande sauteuse, versez une cuillère à soupe d'huile d'olive. Séchez les morceaux de mouton avec un Sopalin et enduisez-les d'épices. Faites dorer dans la sauteuse pendant 4-5 minutes, en les retournant à mi-cuisson.
- Coupez les courgettes en dés et ajoutez-les dans la sauteuse, mélangez bien.
- Ajoutez tous les autres ingrédients en terminant par le bouillon. Salez légèrement car les bouillons sont souvent très salés.
- Faites cuire pendant 15 minutes en remuant régulièrement. Ajoutez un peu de bouillon si nécessaire.
notes:
- texte:
  - Cette recette rapide et parfumée peut être réalisée en un seul contenant pour un résultat très pratique !
source: Carnet salé, p. 62
