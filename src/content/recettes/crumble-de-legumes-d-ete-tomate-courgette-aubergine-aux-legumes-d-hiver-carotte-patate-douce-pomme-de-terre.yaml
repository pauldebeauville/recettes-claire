titre: Crumble de Légumes d'Été (Tomate, Courgette, Aubergine) aux Légumes d'Hiver (Carotte, Patate douce, Pomme de terre)
type: salé
categories:
- plat
- accompagnement
vedettes:
- légumes
ordre: 98
portions: Pour 4 personnes
ingredients:
- groupe: Pour le crumble
- 80 g de parmesan râpé
- 80 g de flocons d'avoine
- 80 g de beurre froid + 1/2 sel
- 80 g de farine d'épeautre
- groupe: Pour les légumes
- 6 petites tomates (enlever le jus)
- 2 courgettes
- 1 aubergine
- Basilic
- 15 olives
- (Optionnel) Du chèvre (si vous le souhaitez)
preparation:
- Préchauffez le four à 180°C.
- Coupez les tomates, enlevez le jus, et mettez-les dans un plat à gratin avec les courgettes et l'aubergine coupées en petits morceaux.
- Ajoutez 2 cuillères à soupe d'huile d'olive, du sel, du poivre, et des herbes.
- Faites cuire pendant 30 minutes.
- Dans un saladier, mettez le parmesan, les flocons d'avoine, puis ajoutez le beurre coupé en petits morceaux (pâte bien sableuse). Ajoutez le basilic et les olives hachées. Vous pouvez également ajouter du chèvre émietté à ce stade si vous le souhaitez.
- Recouvrez de cette pâte à crumble les légumes dans le plat à gratin.
- Faites cuire 25 à 30 minutes pour que le crumble soit doré.
source: Carnet salé, p. 107
