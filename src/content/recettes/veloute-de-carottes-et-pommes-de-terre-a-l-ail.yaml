titre: Velouté de carottes et pommes de terre à l'ail
type: salé
categories:
- soupe
vedettes:
- légumes
ordre: 65
portions: Pour 4 personnes
ingredients:
- 1 c. à soupe d’huile d’olive
- 500 g de carottes
- 1 oignon
- 3 belles pommes de terre
- 1 litre d’eau
- 1 c. à café de bouillon de légumes
- 3 gousses d’ail
- 1/2 c. à café de noix de muscade
- 1/2 c. à café de sel
- 1/2 c. à café de thym (sans tige)
- 1 jaune d’œuf
preparation:
- Émincez les carottes et l’ail.
- Faites revenir ces légumes dans une casserole avec l’huile d’olive.
- Ajoutez ensuite le bouillon de légumes, l’ail, les pommes de terre épluchées et coupées en morceaux, ainsi que les épices (noix de muscade, sel et thym).
- Laissez cuire à feu doux jusqu’à ce que les légumes soient tendres.
- Mixez l’ensemble jusqu’à obtention d’un velouté homogène.
- Incorporez le jaune d’œuf hors du feu et mélangez bien.
- Servez chaud, accompagné de quelques croûtons beurrés.
source: Carnet salé, p. 72
