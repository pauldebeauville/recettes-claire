titre: Vacherin au citron
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 129
portions: Pour 6 personnes
ingredients:
- 'Sucre en poudre : 100 g'
- 'Sucre vanillé : 1 sachet'
- 'Œufs : 3 jaunes'
- 'Crème fraîche : 2 cuillères à soupe'
- 'Citron : 1 jus + 1/2 zeste'
- 'Grosses meringues : 6'
preparation:
- Mélanger 50 g de sucre en poudre avec le sachet de sucre vanillé.
- Ajouter le jus d’un citron et le zeste d’un demi-citron.
- Monter les 3 blancs d’œufs en neige avec les 50 g de sucre en poudre restants.
- Incorporer délicatement 2 cuillères à soupe de crème fraîche pour obtenir une texture homogène. Casser ensuite les meringues en morceaux.
- titre: Dans un moule ou cercle métallique
  texte:
  - Alterner une couche de crème, une couche de meringues en morceaux, et ainsi de suite.
  - Terminer par une couche de crème.
- Mettre au congélateur pour que le vacherin prenne.
- titre: Service
  texte:
  - Décorer avec la crème de l’excédent de cuisson citron (si préparée).
  - Ajouter des framboises sur le dessus ou autres fruits selon votre choix.
notes:
- titre: Astuce
  texte:
  - À la place du citron, vous pouvez utiliser un autre fruit et servir avec un coulis.
  - Pour une version plus généreuse, doubler les quantités pour 10 personnes.
source: Carnet sucré, p. 12
