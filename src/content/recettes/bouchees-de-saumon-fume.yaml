titre: Bouchées de Saumon Fumé
type: salé
categories:
- apéritif
vedettes:
- saumon
ordre: 19
portions: Pour environ 24 bouchées
ingredients:
- 6 tranches de saumon fumé
- 120 g de fromage frais double crème
- 50 g de beurre ramolli
- 1 gousse d’ail écrasée
- 1 c. à soupe de basilic ciselé
- Feuilles de basilic pour la décoration
preparation:
- titre: Préparer le saumon
  texte:
  - Étalez les 6 tranches de saumon fumé pour former un rectangle (environ 20 x 30 cm) sur un film alimentaire.
- titre: Préparer la crème
  texte:
  - Mélangez le fromage frais, le beurre ramolli, l’ail écrasé et le basilic ciselé jusqu’à obtenir une texture homogène.
- titre: Assembler le rouleau
  texte:
  - Répartissez uniformément la préparation sur les tranches de saumon fumé.
  - Enroulez délicatement le tout en serrant bien avec le film alimentaire pour former un rouleau.
- titre: Repos
  texte:
  - Placez le rouleau au réfrigérateur et laissez durcir pendant 2 à 3 heures.
- titre: Finition et service
  texte:
  - Retirez le film alimentaire.
  - Coupez le rouleau en fines rondelles.
  - Disposez les rondelles sur des tranches de baguette ou servez directement.
  - Décorez avec des feuilles de basilic.
source: Carnet salé, p. 19
