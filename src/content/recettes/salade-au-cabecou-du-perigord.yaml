titre: Salade au Cabécou du Périgord
type: salé
categories:
- entrée
vedettes:
- fromage
- volaille
ordre: 87
portions: Pour 4 personnes
ingredients:
- 4 Cabécous
- 1 salade verte
- 400 g de gésiers de canard confits
- 100 g de magret séché et fumé en tranches
- 150 g de cerneaux de noix
- 4 tranches de pain de campagne
- Huile de noix
- Vinaigre
preparation:
- Couper les gésiers et les faire dorer.
- Passer les tranches de pain au grill.
- Dresser les assiettes en disposant la salade, les tranches de magret, les gésiers tièdes et les noix.
- Poser les Cabécous sur les tranches de pain et les passer au four.
- Disposer les Cabécous et les tranches de pain dans les assiettes, ajouter la vinaigrette
source: Carnet salé, p. 96
