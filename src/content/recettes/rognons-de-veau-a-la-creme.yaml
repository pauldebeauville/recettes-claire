titre: Rognons de veau à la crème
type: salé
categories:
- plat
vedettes:
- viande
ordre: 51
portions: Pour 6 personnes
ingredients:
- 1 kg de rognons de veau
- 50 g de beurre
- 1 décilitre de cognac
- 200 g de crème
- 1 cuillère à café de fécule
- 1 cuillère à café de moutarde forte (facultatif)
- Sel, poivre, muscade
preparation:
- Lavez les rognons entiers s'ils sont de même taille, ou coupez-les en deux dans le sens de la longueur. Débarrassez-les de leurs peaux et canaux.
- Faites fondre le beurre dans une poêle. Déposez les rognons et faites-les raidir à feu modéré sans les laisser colorer. Dès qu’ils sont colorés sur toutes les faces, déglacez-les avec le cognac, puis mettez le couvercle. Faites chauffer une seconde, sortez du feu, laissez macérer 10 minutes.
- Retirez les rognons et gardez-les au chaud.
- Faites réduire le jus de moitié. Salez, poivrez et râpez une petite pointe de muscade.
- Ajoutez la crème dans laquelle vous aurez dilué la fécule. Laissez mijoter encore quelques minutes sans couvercle, en grattant le fond pour délayer tous les sucs.
- Ajoutez les rognons, selon le degré de cuisson. Ils doivent être saignants non crus, mais surtout pas trop cuits, l’excès de cuisson les durcissant.
- "Gardez au chaud sans cuire jusqu’au moment de servir. Si vous ajoutez de la moutarde, faites\uFFFEle au moment de servir, dans la sauce bouillante."
source: Carnet salé, p. 55
