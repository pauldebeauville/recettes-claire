titre: Sauce marchand de vin
type: salé
categories:
- sauce
ordre: 105
portions: Pour 4 personnes
ingredients:
- 1 échalote
- 40 g de beurre
- 3/4 de verre de vin rouge corsé
- 1 pointe de cuillère à café de concentré de tomates
- Sel, poivre
- 1 cuillère à café rase de farine
preparation:
- Pelez et hachez l’échalote.
- Dans une poêle contenant 20 g de beurre, faites-la blondir.
- Ajoutez le vin rouge, le concentré de tomates, le sel et le poivre. Portez à ébullition pendant environ 2 minutes.
- Malaxez le reste de beurre avec la cuillère à café de farine.
- Incorporez ce mélange à la sauce, par petits morceaux. Mélangez sur feu doux jusqu'à épaississement.
- Servez bien chaud.
source: Carnet salé, p. 115
