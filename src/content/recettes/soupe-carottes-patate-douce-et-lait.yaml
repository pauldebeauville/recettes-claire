titre: Soupe carottes, patate douce et lait
type: salé
categories:
- soupe
vedettes:
- légumes
ordre: 66
portions: Pour 4 personnes
ingredients:
- 1 oignon
- 1/2 courge butternut ou potimarron (ou remplacez par patate douce, environ 1 kg en tout)
- 1 patate douce (environ 300 g)
- 3 carottes
- 200 ml d’eau
- 1 cube de bouillon de volaille
- 200 ml de lait
- 1 cm de gingembre frais, coupé en dés
preparation:
- Épluchez les légumes (carottes, patate douce et courge) et coupez-les en gros cubes.
- Émincez l’oignon et le gingembre.
- Dans une grande casserole, versez le lait, l’eau et ajoutez le cube de bouillon. Incorporez les légumes coupés, l’oignon et le gingembre.
- Faites bouillir, puis baissez le feu. Laissez cuire à couvert pendant 25 minutes, ou jusqu’à ce que les légumes soient tendres.
- texte:
  - Mixez les légumes avec un blender, en ajustant progressivement la quantité de liquide pour obtenir la texture désirée.
  - Si vous préférez une soupe épaisse, réduisez la quantité de liquide.
- Vérifiez l’assaisonnement et ajustez si nécessaire.
- Servez chaud et, pour la décoration, ajoutez quelques graines de grenade, de coriandre ou un filet d’huile d’olive.
source: Carnet salé, p. 73
