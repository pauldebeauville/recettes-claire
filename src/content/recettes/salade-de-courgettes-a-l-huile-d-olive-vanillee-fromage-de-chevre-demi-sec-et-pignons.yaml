titre: Salade de Courgettes à l'Huile d'Olive Vanillée, Fromage de Chèvre Demi-Sec et Pignons
type: salé
categories:
- entrée
- accompagnement
vedettes:
- légumes
- fromage
ordre: 33
portions: Pour 6 personnes
ingredients:
- 750 g de courgettes (environ 3 pièces)
- 1/3 de litre d’huile d’olive
- 1/3 de gousse de vanille
- 30 g de pignons légèrement grillés
- 1 fromage de chèvre demi-sec
- Sel, poivre
preparation:
- titre: Préparation de l'huile (à réaliser 2-3 jours à l'avance)
  texte:
  - Ouvrez la gousse de vanille et grattez-en l'intérieur avec un petit couteau pour récupérer les grains.
  - Placez les grains et la gousse dans un bocal, puis versez l’huile d’olive par-dessus.
  - Fermez le bocal et laissez infuser dans un endroit tempéré pendant 2 à 3 jours.
- titre: Préparation des courgettes
  texte:
  - Lavez les courgettes, épluchez-les et coupez-les en fines rondelles.
  - Portez une grande casserole d’eau salée à ébullition, puis faites cuire les courgettes pendant 1 à 2 minutes.
  - Égouttez-les immédiatement et refroidissez-les sous l’eau froide pour stopper la cuisson.
- titre: Assemblage
  texte:
  - Dans un saladier, déposez les courgettes égouttées.
  - Salez, poivrez et ajoutez l’huile d’olive vanillée et les pignons grillés.
  - Mélangez délicatement, puis ajoutez des copeaux de fromage de chèvre demi-sec.
- titre: Service
  texte:
  - Servez la salade bien fraîche, en accompagnement de saumon fumé ou d’un carpaccio de bœuf pour une touche encore plus gourmande.
source: Carnet salé, p. 34
