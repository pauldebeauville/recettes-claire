titre: Pêches à la crème de macaron
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 121
portions: Pour 4 personnes
ingredients:
- 'Pêches : compter 1 par personne'
- 'Macarons : 2 petits macarons/personne (pistache, framboise, amande...)'
- 'Gelée de framboises : 2 cuillères à soupe'
- 'Noix : 1 sachet ou 12 noix hachées'
- 'Sucre vanillé : 1 sachet ou en poudre (50 g)'
- 'Crème fraîche : 3 cuillères à soupe'
- 'Petits-suisses : 6'
preparation:
- Éplucher les pêches et les couper en deux.
- Dans un récipient, écraser les macarons et les mouiller avec 2 cuillères à soupe de gelée de framboises. Incorporer les noix pilées pas trop finement et bien mélanger.
- Remplir la cavité des pêches de cette préparation.
- Dans un autre récipient, battre au fouet électrique les petits-suisses, 6 g de sucre en poudre et 2 sachets de sucre vanillé. Ajouter 3 cuillères à soupe de crème fraîche pour obtenir une crème onctueuse.
- Recouvrir les pêches de cette crème vanillée.
- Mettre au réfrigérateur et servir très frais.
source: Carnet sucré, p. 1
