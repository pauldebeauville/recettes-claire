titre: Macaronade Glacée à la Vanille et aux Airelles
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 151
portions: Pour 6 personnes
ingredients:
- groupe: Pour les 12 macarons au chocolat
- 130 g de blancs d'œufs
- 20 g de sucre
- 250 g de sucre glace
- 135 g de poudre d'amandes
- 25 g de cacao
- 1 pincée de sel
- groupe: Pour la glace vanille
- 20 cl de lait entier
- 200 g de crème liquide
- 2 jaunes d'œufs
- 55 g de sucre
- 2 gousses de vanille
- groupe: Pour la compotée d’airelles
- 170 g d'airelles surgelées
- 125 g de sucre
- 125 g d'eau
- 2 pincées de cannelle
- 1/2 jus de citron
- 1 trait d'extrait de vanille
preparation:
- titre: Préparation des macarons au chocolat
  texte:
  - Tamisez ensemble le sucre glace, la poudre d’amandes et le cacao.
  - Montez les blancs d'œufs en neige ferme en ajoutant le sucre semoule petit à petit.
  - Incorporez délicatement les poudres tamisées aux blancs en neige.
  - Mettre cette préparation dans une poche à douille unie.
  - Dressez 12 disques sur une plaque de cuisson recouverte de papier sulfurisé.
  - Glisser la plaque de cuisson sur une autre plaque et faire cuire 12 à 15 minutes à 175°.
  - Sortez les macarons du four et soulevez légèrement le papier de cuisson.
  - Versez un peu d'eau entre la plaque et le papier.
  - Au bout de 2 minutes, détachez délicatement les macarons et les réserver sur une grille.
- titre: Préparation de la glace vanille
  texte:
  - Portez le lait et la crème à ébullition avec les gousses de vanille fendues en 2.
  - Fouettez les jaunes d'œufs avec le sucre jusqu’à blanchiment.
  - Versez le lait chaud sur les jaunes tout en mélangeant.
  - Reversez dans la casserole et faites cuire à feu doux jusqu’à épaississement (85°C), sans bouillir.
  - Laissez refroidir et faites prendre en sorbetière pour obtenir une glace souple et onctueuse.
- titre: Préparation de la compotée d’airelles
  texte:
  - Réunissez dans une casserole les airelles, le sucre, la cannelle, le zeste de citron, extrait de vanille et l’eau.
  - Faites cuire à feu doux jusqu’à réduction du liquide d'un tiers.
  - Laissez refroidir.
- titre: Montage
  texte:
  - Glissez une quenelle de glace vanille entre 2 macarons.
  - Piquez des pistaches dans la glace.
  - Disposez harmonieusement la compotée d’airelles autour.
- titre: Dressage
  texte:
  - Servez immédiatement pour une texture fraîche et gourmande.
notes:
- titre: Conseil
  texte:
  - Pour une glace plus parfumée, laissez infuser la gousse de vanille plus longtemps dans le lait chaud.
source: Carnet sucré, p. 37-38
