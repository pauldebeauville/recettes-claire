titre: Tiramisu (à préparer la veille)
type: sucré
categories:
- dessert
ordre: 155
portions: Pour 6 personnes
ingredients:
- 250 g de mascarpone
- 3 tasses de café décaféiné fort
- 2 ou 3 œufs
- 15 biscuits à la cuillère de qualité
- 4 cuillères à soupe de sucre
- Cacao amer ou pralin (pour saupoudrer)
preparation:
- titre: Préparez le café
  texte:
  - Versez le café dans un récipient creux et laissez-le refroidir complètement (c’est long, pensez à le faire en avance).
- titre: Préparez la crème mascarpone
  texte:
  - Dans un premier récipient, fouettez les jaunes d’œufs avec 4 cuillères à soupe de sucre jusqu’à ce que le mélange blanchisse.
  - Ajoutez le mascarpone et fouettez au batteur électrique quelques secondes pour obtenir une crème lisse.
- titre: Montez les blancs en neige
  texte:
  - Dans un autre récipient, montez les blancs en neige ferme avec une petite quantité de sucre à la fin.
- texte:
  - 'Incorporez délicatement les blancs montés dans le mélange œufs-sucre-mascarpone pour obtenir une crème aérienne. Procédez au montage :'
  - Imbibez rapidement les biscuits à la cuillère dans le café refroidi (attention à ne pas trop les détremper).
  - Disposez une première couche de biscuits dans le fond du plat.
  - Recouvrez d’une couche de crème mascarpone.
  - Répétez les couches en alternant biscuits et crème.
  - Entre chaque couche, mettez au frais quelques minutes pour éviter que la crème ne devienne trop liquide.
- titre: Finition
  texte:
  - Terminez par une couche de crème mascarpone.
  - Placez au congélateur pendant 2 heures, puis laissez le tiramisu au réfrigérateur jusqu’au moment de servir.
- titre: Dressage
  texte:
  - Saupoudrez généreusement de cacao amer ou de pralin juste avant de servir.
notes:
- titre: Conseils
  texte:
  - Surveillez la consistance de la crème pour qu’elle reste épaisse et ne coule pas.
  - Si vous préférez, réalisez des portions individuelles pour une présentation élégante.
source: Carnet sucré, p. 43
