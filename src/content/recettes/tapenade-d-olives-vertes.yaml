titre: Tapenade d'Olives Vertes
type: salé
categories:
- apéritif
- sauce
ordre: 103
ingredients:
- 180 g d'olives vertes dénoyautées
- 6 cuillères à soupe bombées d'amande en poudre
- 2 gousses d'ail
- 6 cuillères à soupe de basilic
- 6 cuillères à soupe d'huile d'olive
preparation:
- Mettre tous les ingrédients dans un mixeur.
- Mixer jusqu'à obtenir une pâte bien lisse.
source: Carnet salé, p. 113
