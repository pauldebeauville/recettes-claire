titre: Carpaccio de Merlan
type: salé
categories:
- entrée
vedettes:
- poisson
ordre: 11
portions: Pour 5 personnes
ingredients:
- 5 filets de merlan (1 filet par personne, sans arêtes)
- 7 c. à soupe d’huile d’olive
- 2 échalotes (finement hachées)
- 2 citrons verts (jus)
- ½ c. à café de sel fin
- ½ bouquet de coriandre fraîche (ou un paquet d’herbes pour poisson surgelées, type Picard)
- 3 c. à soupe de mangue ou d’avocat (coupés en dés)
preparation:
- titre: Préparer le poisson
  texte:
  - Nettoyez les filets de merlan, puis tranchez-les finement en lamelles.
- titre: Préparer la marinade
  texte:
  - Mélangez dans un bol l’huile d’olive, le jus de citron vert, le sel, les échalotes hachées et la coriandre finement coupée.
- titre: Assembler le carpaccio
  texte:
  - Disposez les tranches de merlan dans un plat ou sur des assiettes individuelles.
  - Versez la marinade uniformément sur le poisson.
- titre: Ajouter les accompagnements
  texte:
  - Parsemez le carpaccio avec les dés de mangue ou d’avocat.
- titre: Repos
  texte:
  - Couvrez le plat avec un film alimentaire et laissez mariner au frais pendant 10 minutes.
- titre: Service
  texte:
  - Servez frais, avec une salade verte ou des toasts grillés en accompagnement.
notes:
- titre: Astuce
  texte:
  - Ajoutez une pincée de piment d’Espelette pour relever le goût.
source: Carnet salé, p. 11
