titre: Mousseline de Saint-Jacques au Coulis d'Écrevisses
type: salé
categories:
- entrée
vedettes:
- fruits de mer
ordre: 34
portions: Pour 6 personnes
ingredients:
- groupe: Ingrédients principaux
- 375 g de chair de noix et corail de Saint-Jacques fraîches
- 10 g de sel
- 10 tours de moulin à poivre
- 1 œuf entier
- 1 blanc d’œuf
- 1/2 litre de crème fraîche double très froide
- 50 g de beurre fondu
- 6 écrevisses décortiquées (6 têtes vides + 6 queues)
- 6 rondelles de truffes (facultatif)
- groupe: Sauce d'accompagnement
- 40 cl de coulis d’écrevisses
- 'Alternative : sauce Picard à base de beurre blanc au Noilly Prat'
preparation:
- titre: Préparer la mousseline
  texte:
  - Mixez les noix de Saint-Jacques avec le sel et le poivre pendant 3-4 minutes jusqu'à obtenir une pâte lisse.
  - Ajoutez l’œuf entier et le blanc d’œuf, puis mixez à nouveau pendant 1 minute pour bien homogénéiser. Placez le mélange au réfrigérateur pendant 30 minutes.
- titre: Incorporer la crème fraîche
  texte:
  - Remettez le bol sur le mixeur, versez la crème fraîche très froide et mixez quelques secondes jusqu’à obtenir une texture onctueuse.
- titre: Préparer les ramequins
  texte:
  - Beurrez les ramequins avec le beurre fondu à l’aide d’un pinceau.
- titre: Remplir les ramequins
  texte:
  - Versez la mousseline dans les ramequins jusqu’au bord. Placez-les dans un bain-marie et enfournez dans un four préchauffé à 220°C (Thermostat 7) pendant 30 minutes.
- titre: Finition
  texte:
  - Vérifiez que la surface ne durcisse pas pendant la cuisson. Si nécessaire, couvrez les ramequins avec une feuille d’aluminium.
- titre: Démoulage et nappage
  texte:
  - Nappez généreusement les mousselines de coulis d’écrevisses ou de sauce Picard au beurre blanc et Noilly Prat.
  - Décorez chaque mousseline avec une rondelle de truffe et une écrevisse reconstituée (tête et queue).
notes:
- titre: Ustensiles
  texte:
  - 1 mixeur
  - 1 pinceau
  - 4 ramequins pour 250 g de chair crue (prévoyez 6 ramequins pour cette recette)
  - 1 bain-marie
  - 6 assiettes plates ou un grand plat de service
- titre: Astuces et idées maison
  texte:
  - 'La mousseline peut être réalisée avec d''autres poissons :'
  - 375 g de chair crue de homard ou langouste.
  - 250 g de chair crue de brochet, turbot, Saint-Pierre, merlan, sole, colin ou calamar (prévoyez 4 ramequins pour cette quantité).
  - Une version simplifiée consiste à mélanger 200 g de chair de poisson broyée, 1/2 litre de lait, 4 jaunes d’œufs, et 2 œufs entiers. Assaisonnez, cuisez au bain-marie comme une crème caramel.
  - Les queues d’écrevisses réservées peuvent être glissées dans les mousselines avant la cuisson pour un effet surprise.
  - Les truffes peuvent être remplacées par des demi-olives dénoyautées.
  - Le coulis d’écrevisses peut être remplacé par un coulis de tomates parfumé au basilic ou à l’estragon.
source: Carnet salé, p. 35-36
