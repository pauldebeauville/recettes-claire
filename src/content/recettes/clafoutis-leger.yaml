titre: Clafoutis Léger
type: sucré
categories:
- dessert
vedettes:
- fruits
ordre: 153
portions: Pour 6 personnes
ingredients:
- 750 g de framboises, pommes, poires, abricots, prunes, etc. (sacs Picard)
- 85 g de farine maximum
- 4 œufs (ou 3 œufs + 1 jaune)
- 180 g de sucre (si fruits surgelés)
- 250 g de crème fraîche
- 1 pincée de sel
preparation:
- Préchauffez le four à 210°C (thermostat 7).
- Dans une jatte, mélangez la farine, le sucre, les œufs et le sel. Fouettez sans arrêt tout en ajoutant progressivement le lait.
- Incorporez la crème fraîche pour obtenir une pâte bien lisse.
- titre: Préparation du moule
  texte:
  - Beurrez légèrement un moule à tarte en porcelaine. Pour un meilleur résultat, placez du papier de cuisson à l’intérieur du moule.
- Versez la préparation dans le moule.
- titre: Cuisson initiale
  texte:
  - Enfournez pendant 5 à 8 minutes (dès que la crème commence à épaissir).
- Disposez les fruits légèrement sucrés (ou surgelés) en les enfonçant légèrement dans la pâte.
- titre: Deuxième cuisson
  texte:
  - Remettez au four pendant 55 minutes à 150°C pour une cuisson douce et uniforme. Ce mode de cuisson à basse température est idéal pour un meilleur résultat.
notes:
- titre: Finition
  texte:
  - Laissez refroidir le clafoutis avant de le démouler.
  - Servez tiède ou froid selon vos préférences.
- titre: Astuce
  texte:
  - La cuisson à basse température rend ce clafoutis particulièrement fondant et savoureux.
  - Compter 1 heure pour la préparation totale du dessert.
source: Carnet sucré, p. 41
