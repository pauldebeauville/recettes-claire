titre: Cake à la pâte d’amande et crème au chocolat au lait d’amande
type: sucré
categories:
- dessert
vedettes:
- chocolat
ordre: 128
ingredients:
- groupe: Pour le cake
- 'Beurre mou : 150 g'
- 'Pâte d’amande (mini 50 % d’amandes, de bonne qualité) : 90 g'
- 'Sucre en poudre : 140 g'
- 'Œufs : 3'
- 'Farine de blé ou de petit épeautre : 120 g'
- 'Amandes effilées : 30 g'
- groupe: Pour la crème au chocolat au lait d’amande (pour 4/6 portions)
- 'Chocolat noir : 225 g (coupé en petits morceaux)'
- 'Lait d’amande non sucré : 20 cl'
- 'Beurre doux : 35 g'
preparation:
- section: Préparation du cake
- Préchauffer le four à 175°C.
- Mélanger le beurre mou et la pâte d’amande pour obtenir une consistance homogène. Il est important d’utiliser un beurre bien mou et une pâte d’amande souple pour éviter les grumeaux.
- titre: Ajouter les autres ingrédients dans cet ordre
  texte:
  - le sucre, les œufs un à un, puis la farine tamisée (blé ou petit épeautre). Bien mélanger entre chaque ajout pour obtenir une pâte lisse et homogène.
- Verser la pâte dans un moule à cake de 22 cm de long ou dans un moule carré de 22 cm.
- Saupoudrer d’amandes effilées.
- Enfourner pendant 25 minutes. Vérifier la cuisson avec la pointe d’un couteau. Si la cuisson est réalisée dans un moule à cake (où l’épaisseur est plus importante), prolonger la cuisson de 5 à 7 minutes si nécessaire.
- section: Préparation de la crème
- Faire frémir le lait d’amande dans une casserole.
- Ajouter les morceaux de chocolat hors du feu, puis remuer avec une cuillère en bois pour bien lisser la préparation.
- Incorporer le beurre doux et mélanger jusqu’à obtenir une crème onctueuse.
- Attendre 5 minutes avant de verser la crème dans 4 à 6 petits bols ou ramequins.
source: Carnet sucré, p. 10
