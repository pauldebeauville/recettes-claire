titre: Souris d'agneau confite avec polenta crémeuse
type: salé
categories:
- plat
vedettes:
- viande
ordre: 49
portions: Pour 2 personnes
ingredients:
- 2 souris d'agneau
- 3 cuil. à soupe de miel d’acacia
- 50 cl d'eau (ou 50 cl de bouillon de légumes si vous n'avez pas de thym, laurier, romarin)
- 1 cuil. à soupe de thym, 1 cuil. à soupe de romarin, 1 cuil. à soupe de laurier (si vous ne mettez pas de bouillon)
- 2 oignons
- 40 g de raisins secs
- 250 g de polenta
- 1,7 litre d'eau
- 50 g de parmesan
preparation:
- titre: Souris d'agneau confite
  texte:
  - Préchauffer le four à 180°C.
  - Dans une cocotte, faire revenir à feu vif les souris d'agneau de tous les côtés. Saler, poivrer et verser l'eau (ou le bouillon de légumes), le miel, le thym, le romarin et le laurier. Mélanger.
  - Mettre la cocotte (avec le couvercle) au four pendant 2 heures. Ouvrir régulièrement pour arroser les souris avec le jus.
  - Si elles cuisent trop vite, baisser le four et cuire plus longtemps.
- titre: Polenta crémeuse
  texte:
  - Dans une grande casserole, verser le litre d'eau, ajouter du sel et amener à ébullition.
  - Verser la polenta et remuer. Baisser le feu et couvrir. Remuer tous les 4-5 minutes en raclant bien les bords et le fond. Laisser cuire 30-35 minutes.
  - À la fin, ajouter le parmesan hors du feu.
  - Garder le reste de la polenta, que vous couperez en cubes et ferez revenir à la poêle le lendemain.
- titre: Finition
  texte:
  - Dans une assiette, déposez la polenta, placez la souris dessus et versez la sauce aux raisins. Vous pouvez servir avec des bouquets de brocolis cuits à la vapeur.
source: Carnet salé, p. 53
