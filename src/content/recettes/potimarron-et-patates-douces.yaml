titre: Potimarron et patates douces
type: salé
categories:
- accompagnement
vedettes:
- légumes
ordre: 118
ingredients:
- 1 potimarron
- 1 ou 2 patates douces (selon la taille)
- Huile d'olive
- 1 citron
preparation:
- Pelez et coupez le potimarron et les patates douces en cubes.
- Faites cuire les cubes de légumes à la vapeur pendant environ 10 minutes, jusqu'à ce qu'ils soient tendres.
- Une fois cuits, mélangez-les dans un saladier avec un peu d'huile d'olive et du jus de citron.
- Ajustez l'assaisonnement selon votre goût.
source: Carnet salé, p. 129
