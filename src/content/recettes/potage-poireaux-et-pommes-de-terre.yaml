titre: Potage poireaux et pommes de terre
type: salé
categories:
- soupe
vedettes:
- légumes
ordre: 70
portions: Pour 4 personnes
ingredients:
- 2 grosses pommes de terre
- 1 poireau (ou un petit paquet de poireaux prêts à l’emploi)
- 1 oignon
- 1 c. à café de bouillon de légumes
- 1 litre d’eau
- Sel, poivre
- Persil frais
preparation:
- Épluchez les pommes de terre et l’oignon. Coupez-les en rondelles.
- Lavez et coupez le poireau en fines rondelles.
- Dans une casserole, versez 1 litre d’eau et ajoutez les légumes, le bouillon de légumes, le sel, le poivre, et le persil haché.
- Faites cuire à feu doux pendant environ 30 minutes, jusqu’à ce que les légumes soient bien fondants.
- Mixez la préparation pour obtenir un potage lisse et homogène, ou écrasez légèrement pour une texture rustique.
- Servez chaud, garni de persil frais pour renforcer la saveur et la présentation.
source: Carnet salé, p. 77
