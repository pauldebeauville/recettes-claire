titre: Terrine de Poulet Nanou
type: salé
categories:
- entrée
- plat
vedettes:
- volaille
ordre: 56
portions: Pour 6 personnes
ingredients:
- 500 g de poulet haché (faire la veille)
- 100 g de parmesan râpé
- 50 g de riz cuit
- 2 œufs
- 7 tomates séchées coupées en petits morceaux
- 1 bouquet de basilic (3 tiges découpées) ou 2 cs d'estragon
preparation:
- Préchauffez le four à 180°C.
- Dans un saladier, mélangez tous les ingrédients à l'aide d'une fourchette. Salez, poivrez, et ajoutez le basilic ou l'estragon.
- Versez dans un moule à cake huilé.
- Faites cuire pendant 1 heure.
- Laissez refroidir et servez froid.
- Accompagnez d'une sauce yaourt avec des herbes.
source: Carnet salé, p. 61
