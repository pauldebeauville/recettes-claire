titre: Saumon Fumé, Crumble Noisette, Avocat, Chantilly
type: salé
categories:
- entrée
vedettes:
- saumon
ordre: 84
portions: Pour 4 personnes
ingredients:
- groupe: Pour le saumon et l'avocat
- 250 g de saumon fumé
- 1 avocat
- 5 cuillères à soupe de crème fraîche épaisse
- groupe: Pour le crumble noisette
- 40 g de noisettes en poudre
- 40 g de parmesan râpé
- 40 g de beurre froid coupé en petits morceaux
- 40 g de chapelure fine
- groupe: Pour la garniture
- Aneth frais
- Citron
preparation:
- Préchauffer le four à 180°C.
- Dans un saladier, mélanger tous les ingrédients du crumble (noisettes, parmesan, beurre et chapelure). Il faut obtenir des grosses miettes.
- Étaler la pâte obtenue sur une plaque de cuisson recouverte de papier sulfurisé.
- Cuire au four pendant 15 minutes, jusqu'à ce que le crumble soit doré.
- Pendant ce temps, éplucher l'avocat, l'écraser et le mixer avec 2 cuillères à soupe de crème fraîche.
- Préparer la chantilly en fouettant la crème fraîche avec 3 cuillères à soupe de crème.
- Couper le saumon en 4 parts et les disposer sur des assiettes.
- Répartir la crème à l'avocat sur le saumon, puis décorer avec la chantilly par-dessus.
- Ajouter de l'aneth frais haché et un peu de jus de citron à la fin pour parfumer le plat.
source: Carnet salé, p. 93
