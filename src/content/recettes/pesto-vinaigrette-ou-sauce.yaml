titre: Pesto Vinaigrette ou Sauce
type: salé
categories:
- sauce
ordre: 107
portions: 6 personnes
ingredients:
- 60 g de pignons grillés
- 60 g de parmesan
- 30 feuilles de basilic
- 8 cuillères à soupe d'huile d'olive
preparation:
- Mixer les pignons grillés avec le parmesan, le poivre, les feuilles de basilic et l'huile d'olive pour obtenir une pâte lisse.
- Utilisez comme sauce ou vinaigrette selon vos préférences.
source: Carnet salé, p. 117
