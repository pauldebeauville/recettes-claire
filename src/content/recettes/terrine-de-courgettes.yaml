titre: Terrine de courgettes
type: salé
categories:
- entrée
vedettes:
- légumes
ordre: 69
portions: Pour 6 à 8 personnes
ingredients:
- 2,4 kg de courgettes
- 8 gousses d’ail ou 8 cuillères à café d’ail écrasé
- 6 cuillères à soupe de persil haché
- 6 cuillères à soupe de chapelure
- 8 œufs entiers
- 4 bouquets de basilic
- 8 cuillères à soupe de fromage blanc
- 2 barquettes de lardons fumés
- 2 à 4 cuillères à soupe d’huile d’olive
- Sel, poivre
preparation:
- Ne pas éplucher les courgettes. Coupez-les en cubes.
- Faites-les revenir dans une poêle avec l’huile d’olive.
- Dans une autre poêle, faites dorer les lardons fumés.
- Ajoutez l’ail, le persil, et le basilic aux courgettes. Mélangez bien et laissez cuire quelques minutes.
- Dans un récipient, battez les œufs en omelette. Ajoutez la chapelure, le fromage blanc, le sel, et le poivre. Mélangez bien.
- Beurrez un moule à cake (ne pas huiler). Répartissez au fond et sur les côtés les courgettes coupées en rondelles et dorées à la poêle.
- Ajoutez la préparation d’œufs et de lardons dans le moule. Lissez la surface.
- Faites cuire au four préchauffé à thermostat 5-6 (160-180 °C) pendant 45 minutes.
notes:
- titre: Conseil
  texte:
  - Cette terrine peut être servie chaude ou froide, accompagnée d’une purée de tomates ou d’une salade verte.
source: Carnet salé, p. 76
