titre: Dessert Extra aux Noix (à faire le jour-même)
type: sucré
categories:
- dessert
ordre: 150
portions: Pour 8 personnes
ingredients:
- 140 g de beurre fin
- 140 g de sucre glace (ou un sachet de sucre vanillé)
- 180 g de noix hachées
- 70 g de farine
- 3 œufs
- 1 grosse cuillère à soupe de crème fraîche épaisse
- 1/2 tasse à café de Grand Marnier
preparation:
- Mélangez le beurre ramolli et le sucre jusqu’à obtention d’une crème jaune épaisse (dans le magimix).
- Dans un autre saladier, mélangez les noix, la farine et le Grand Marnier.
- Battez les blancs d'œufs en neige ferme en ajoutant un peu de sucre glace.
- Unir le mélange beurre + sucre au mélange noix-farine-Grand Marnier, puis les blancs d'oeufs.
- Terminez en ajoutant la crème fraîche épaisse.
- section: Cuisson
- Versez la préparation dans un moule à tarte ou un fond amovible chemisé de papier cuisson.
- Enfournez à 150°C pendant 35 minutes.
- Laissez refroidir avant de démouler facilement grâce au papier cuisson.
- section: Glacage
- Mélangez les 3 jaunes d'œufs et 95 g de sucre glace + un sachet de sucre vanillé.
- Étalez ce glaçage sur le dessus du dessert refroidi.
- Si désiré, ajoutez quelques gouttes de Grand Marnier pour parfumer.
notes:
- titre: Dressage
  texte:
  - Servez ce dessert avec de la glace à la vanille, au nougat ou au caramel pour un contraste de saveurs gourmandes.
- titre: Astuce
  texte:
  - Tout peut être fait dans le magimix.
  - Pour une préparation simplifiée, utilisez un cercle de 6 personnes, recouvert de papier cuisson et tout remplir. Mettre au four pendant 35 minutes. Ce dessert est aussi pratique à transporter directement sur le papier cuisson.
source: Carnet sucré, p. 36
