titre: Flan de poireaux au chèvre
type: salé
categories:
- entrée
vedettes:
- légumes
- fromage
ordre: 72
portions: Pour 4 personnes
ingredients:
- 4 poireaux (environ)
- 120 g de chèvre frais (1 bûche ou équivalent)
- 1 oignon ou 2 échalotes
- 3 œufs
- 150 g de yaourt à la grecque
- 1/2 bûche de chèvre (pour la finition)
- 2 c. à soupe d’huile d’olive
- Noix de muscade
- Sel, poivre
preparation:
- Préchauffez le four à 180 °C.
- Lavez les poireaux, émincez-les et faites-les revenir dans une poêle avec 2 c. à soupe d’huile d’olive et l’oignon ou les échalotes hachés. Faites cuire à feu doux jusqu’à ce que les poireaux soient tendres. Réservez dans un saladier.
- Dans un bol, fouettez les œufs avec le yaourt à la grecque, le chèvre frais émietté, et une pincée de noix de muscade. Assaisonnez avec du sel et du poivre.
- Incorporez les poireaux cuits dans la préparation. Mélangez bien pour répartir les ingrédients de manière homogène.
- Versez le mélange dans un plat à gratin ou des ramequins beurrés. Disposez des rondelles de chèvre (de la bûche) sur le dessus et saupoudrez d’un peu de noix de muscade.
- Faites cuire au four pendant environ 20 minutes, jusqu’à ce que le flan soit bien doré et ferme au toucher.
notes:
- titre: Conseil
  texte:
  - Servez chaud ou tiède, accompagné d’une salade verte ou de légumes grillés pour un repas équilibré.
source: Carnet salé, p. 79
