titre: Chips de patate douce
type: salé
categories:
- apéritif
- accompagnement
vedettes:
- légumes
ordre: 104
ingredients:
- Huile d'olive
- Patate douce
- Citron
- Herbes (romarin, thym, etc.)
- Sel
preparation:
- Versez un peu d'huile d'olive sur une plaque à four.
- Coupez des fines tranches de patate douce, sans les superposer.
- Arrosez les tranches d'un peu de citron.
- Versez un peu d'huile d'olive sur les tranches, puis ajoutez des herbes (romarin, thym, etc.).
- Assaisonnez de sel.
- Cuire au four à 180°C pendant environ 15 minutes.
source: Carnet salé, p. 114
